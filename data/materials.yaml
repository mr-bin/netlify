# ============================================================================
# МЕТКИ — список допустимых меток и их порядок (кнопки-фильтры на сайте)
# ============================================================================
#
# Эту часть редактируете вы сами: дописывайте новую метку в список или
# меняйте строки местами — кнопки-фильтры на сайте идут в точности в этом
# порядке. Чтобы добавить метку:
#   1. Впишите её новой строкой сюда, в список labels.
#   2. Впишите её в поле labels у нужных листов ниже (раздел materials).
# Кнопка-метка появляется на сайте, только если у неё 2 листа и больше —
# одной метке, добавленной только одному листу, кнопки пока не будет (как
# только появится второй лист с этой меткой — кнопка появится сама).
#
# Кнопка «С видео» в список ниже писать не нужно — сайт добавляет её сам
# (если у листа заполнено поле video_url) и всегда ставит её последней.
#
labels:
  - "Когда тревожно"
  - "Лучше узнать себя"

# ============================================================================
# МАТЕРИАЛЫ — данные для раздела «Материалы» на сайте (PDF для скачивания)
# ============================================================================
#
# Этот файл редактируется вручную, без помощи программиста. После правки
# файла нужно опубликовать изменения (сохранить — «Commit changes» — на
# GitHub, см. education_readme.md, раздел «Как открыть файлы на GitHub» —
# шаги там те же самые для любого файла в data/).
#
# Порядок карточек на сайте = порядок записей в этом файле.
#
# Поля одной записи:
#   title       (обязательно) — название материала, без кавычек.
#   description (обязательно) — короткое описание, 1 строка.
#   pages       (обязательно) — число страниц в PDF, например 4. Слово
#                "страница/страницы/страниц" и приставка "PDF ·" подставляются
#                сайтом сами — писать их не нужно.
#   file        (обязательно) — имя файла PDF. Сам файл должен лежать в папке
#                assets/materials/ (без подпапок). Пример: "novyy-list.pdf".
#                На сайте он будет доступен по адресу вида
#                ekaterina-zaikina.page/materials/novyy-list.pdf
#                Из этого же имени сайт сам собирает id карточки для ссылок
#                на неё (например, novyy-list.pdf → list-novyy-list) — вписывать
#                id отдельно не нужно.
#   video_url   (необязательно) — ссылка на видео к этому материалу (например
#                на YouTube). Если заполнено — на карточке появляется кнопка
#                «Смотреть видео», а метка «С видео» ставится сайтом сама
#                (вручную её в labels писать не нужно). Если это видео есть
#                и в разделе «Видео» — под ним на сайте сама появится строка
#                «Лист к этому видео» со ссылкой на эту карточку. Если
#                оставить video_url: "" — кнопки не будет, появится сама, как
#                только ссылку впишете (без других правок).
#   labels      (обязательно, список) — одна или несколько меток материала,
#                каждая должна быть словом в словом такой же, как в списке
#                labels в начале этого файла. Метка с опечаткой или метка,
#                которой нет в списке labels, не ломает сайт — сборка просто
#                выведет предупреждение, лист останется без этой метки.
#   favorite    (обязательно) — true или false. Пока ни на что на сайте не
#                влияет — поле подготовлено на будущее (для избранных листов
#                на главной). У всех листов сейчас false.
#   show        (обязательно) — true или false. false — карточка подготовлена,
#                но ещё не показывается на сайте (например, файл ещё не готов).
#                Включить её — поменять false на true.
#
# Текст (title, description) можно писать обычными кавычками-ёлочками («...»)
# и обычными пробелами — неразрывные пробелы (&nbsp;) после коротких
# предлогов/союзов (в, с, к, о, на, по и т.д.) сайт расставит сам.
#
# ВАЖНО ПРО ОТСТУПЫ: это YAML-файл, в нём важны пробелы в начале строки.
# Проще всего — скопировать существующий блок записи целиком и поменять в
# копии только текст после двоеточий, не трогая отступы.
#
# ПРИМЕР НОВОЙ ЗАПИСИ (скопируйте блок целиком себе в конец списка и замените
# текст):
#   - title: "Название материала"
#     description: "Короткое описание, одна строка"
#     pages: 2
#     file: "novyy-list.pdf"
#     video_url: ""
#     labels:
#       - "Лучше узнать себя"
#     favorite: false
#     show: false
#
