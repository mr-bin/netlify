# ============================================================================
# МАТЕРИАЛЫ — данные для раздела «Материалы» на сайте (PDF для скачивания)
# ============================================================================
#
# Этот файл редактируется вручную, без помощи программиста. После правки
# файла нужно опубликовать изменения (сохранить — «Commit changes» — на
# GitHub, см. education_readme.md, раздел «Как открыть файлы на GitHub» —
# шаги там те же самые для любого файла в data/).
#
# Порядок карточек на сайте = порядок записей в этом файле.
#
# Поля одной записи:
#   title       (обязательно) — название материала, без кавычек.
#   description (обязательно) — короткое описание, 1 строка.
#   pages       (обязательно) — число страниц в PDF, например 4. Слово
#                "страница/страницы/страниц" и приставка "PDF ·" подставляются
#                сайтом сами — писать их не нужно.
#   file        (обязательно) — имя файла PDF. Сам файл должен лежать в папке
#                assets/materials/ (без подпапок). Пример: "novyy-list.pdf".
#                На сайте он будет доступен по адресу вида
#                ekaterina-zaikina.page/materials/novyy-list.pdf
#   video_url   (необязательно) — ссылка на видео к этому материалу (например
#                на YouTube). Если заполнено — на карточке появляется кнопка
#                «Смотреть видео». Если оставить "" — кнопки не будет, появится
#                сама, как только ссылку впишете (без других правок).
#   show        (обязательно) — true или false. false — карточка подготовлена,
#                но ещё не показывается на сайте (например, файл ещё не готов).
#                Включить её — поменять false на true.
#
# Текст (title, description) можно писать обычными кавычками-ёлочками («...»)
# и обычными пробелами — неразрывные пробелы (&nbsp;) после коротких
# предлогов/союзов (в, с, к, о, на, по и т.д.) сайт расставит сам.
#
# ВАЖНО ПРО ОТСТУПЫ: это YAML-файл, в нём важны пробелы в начале строки.
# Проще всего — скопировать существующий блок записи целиком и поменять в
# копии только текст после двоеточий, не трогая отступы.
#
# ПРИМЕР НОВОЙ ЗАПИСИ (скопируйте блок целиком себе в конец списка и замените
# текст):
#   - title: "Название материала"
#     description: "Короткое описание, одна строка"
#     pages: 2
#     file: "novyy-list.pdf"
#     video_url: ""
#     show: false
#
