# ============================================================================
# Страница-подборка «Статьи» — адрес /stati/ (шаблон stati.html.template).
#
# Карточки статей сайт собирает сам из data/video/*.yaml (статьи к видео) и
# data/stati/*.yaml (статьи без видео): у каждой статьи должны быть
# заполнены topic (ключ группы из списка groups ниже) и card_text (одна
# строка для карточки). Статьи с show: false на странице не показываются.
#
# Здесь — только тексты страницы и список групп:
# - title, description — для поисковиков, только обычные пробелы;
# - intro — вступление под заголовком «Статьи» (каждый абзац — строка списка);
# - cta — приглашение в концовке, перед оговоркой и кнопкой записи;
# - groups — группы в порядке показа сверху вниз: key — ключ, который
#   пишется в topic у статьи, heading — заголовок группы на странице.
#   Новая группа — новая строка в groups, шаблон править не нужно.
#   Группа без статей не выводится; карточки внутри группы — от новых
#   к старым (по upload_date у статей с видео, по published — у остальных).
#
# Неразрывные пробелы (после предлогов и перед тире) сайт ставит сам.
# ============================================================================
title: "Статьи психолога: ЭКО, беременность, потери, тревога в ожидании — Екатерина Заикина"
description: "Статьи психолога о планировании беременности, ЭКО, беременности, потерях и тревоге в ожидании. Тексты по мотивам видео и отдельные статьи, на русском языке."
intro:
  - "Тексты о том, с чем люди приходят к психологу: ожидание беременности, ЭКО, беременность, потери, тревога. Часть статей написана по мотивам видео на канале, часть — отдельно."
cta: "Если хочется разобраться вместе — напишите мне. Первая встреча — интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
groups:
  - key: "planning"
    heading: "Планирование беременности"
  - key: "infertility"
    heading: "Бесплодие и диагнозы"
  - key: "ivf"
    heading: "ЭКО"
  - key: "pregnancy"
    heading: "Беременность"
  - key: "loss"
    heading: "Потеря беременности"
  - key: "away"
    heading: "Вдали от дома"
  - key: "anxiety"
    heading: "Тревога в ожидании"
  - key: "first-meeting"
    heading: "Первая встреча с психологом"
