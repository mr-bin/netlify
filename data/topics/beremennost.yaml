faq:
  heading: "Частые вопросы"
  items:
    - q: "Можно ли прийти, если всё хорошо и просто хочется подготовиться?"
      a: "Да. Можно прийти на любом сроке, без «серьёзного повода». Иногда достаточно желания спокойно подумать о переменах и о том, какой мамой хочется быть."
    - q: "Тревога во время беременности вредна для ребёнка?"
      a: "Переживать во время беременности естественно. Уровень кортизола, гормона стресса, в беременность в норме растёт в 2–3 раза, и у организма есть механизмы, которые защищают ребёнка. Тревога из-за тревоги только добавляет напряжения. Если тревога сильная и мешает жить, это повод обратиться к врачу."
      # Показывается в конце ответа, только когда заполнен video.url.
      if_video: "Подробнее&nbsp;— в видео «[Беременным нельзя нервничать?](#video)»."
    - q: "А если ребёнок уже родился?"
      a: "Тоже можно прийти. Мы поработаем с тем, что происходит сейчас: с переменами в жизни, в отношениях и в ощущении себя."
    - q: "Может ли прийти партнёр?"
      a: "Да, индивидуально. Переживания во время беременности бывают и у партнёра. Совместные сессии для пары я не провожу."
    - q: "Сколько обычно длится такая работа?"
      a: "Это зависит от запроса. Мы обсуждаем это на первой встрече и пересматриваем по ходу работы."

