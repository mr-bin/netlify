seo:
  title: "Психолог во время беременности онлайн на русском — Екатерина Заикина"
  description: "Поддержка во время беременности: тревога и страхи, мысли о том, какой мамой я буду, перемены в жизни и теле. Индивидуально, онлайн, на русском языке."

breadcrumb: "Беременность"

hero:
  h1: "Психологическая поддержка во время беременности"
  lead: "Тревога и страхи, мысли о том, какой будет жизнь с ребёнком и какой мамой я буду, перемены в теле и в отношениях."
  lead_soft: "Индивидуально, онлайн, на русском языке."
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Мамой становятся раньше, чем рождается ребёнок"
  paragraphs:
    - "Беременность&nbsp;— это не только девять месяцев ожидания. В это время часто думается о будущем: как изменится жизнь, отношения, работа, тело, какой мамой я буду. Вспоминается своё детство и своя мама: что хочется взять с собой, а что оставить."
    - "Радость и тревога могут приходить вместе, и это нормально. Женщина становится мамой задолго до реального опыта материнства, и это время можно прожить с поддержкой."
    - "Об этапах, через которые женщина становится мамой,&nbsp;— в коротком видео «[Когда женщина становится мамой?](https://youtube.com/shorts/I1egM49AIOM)»&nbsp;→"

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Тревога и страхи"
      sub: "Перед УЗИ, анализами, родами. Мысли «а вдруг…»"
    - title: "Тревожусь из-за того, что тревожусь"
      sub: "«Беременным нельзя нервничать», и от этого становится ещё тревожнее"
    - title: "Смешанные чувства"
      sub: "Радость, сомнения и усталость одновременно, или не чувствуется того, что «положено» чувствовать"
    - title: "Какой мамой я буду"
      sub: "Ожидания от себя, мысли о том, что хочется взять из своего детства, а что оставить"
    - title: "Перемены в теле и в жизни"
      sub: "Новый образ себя, работа, отношения с партнёром и близкими"
    - title: "Беременность после потери или после ЭКО"
      sub: "Когда радость приходит вместе с тревогой и поверить в хорошее непросто"
    - title: "Беременность вдали от дома"
      sub: "Другая страна или город, где многое устроено иначе, а близких нет рядом"
  note: "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство"
      text: "Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
    - title: "Точка А и точка Б"
      text: "Проясняем, что происходит сейчас, к чему хочется прийти и как мы поймём, что работа получается."
    - title: "Ваша история"
      text: "Как проходит беременность, как вы себя чувствуете сейчас, как узнали о беременности, каких ожиданий много от себя и от будущего, какая медицинская история за плечами. Я могу спросить и о вашем детстве: какой вы видели свою маму, какой мамой мечтали стать. Это помогает разделить свой детский опыт и своё будущее материнство. Иногда мы работаем через рисунки и образы. Если на какие-то темы вы пока не готовы говорить, можно не говорить."
    - title: "Опора на сейчас и на будущее"
      text: "Ищем, что помогает в тревожные минуты, и думаем, на что опереться после рождения ребёнка: помощь близких, вопросы врачу, маленькие шаги. Некоторые практики можно пробовать и самостоятельно, например упражнение «[Тёплое одеяло](/#list-teploe-odeyalo)» и лист «[Когда накрыла тревога](/#list-kogda-nakryla-trevoga)». Решения остаются вашими."

expect:
  heading: "Чего ждать от работы"
  bg: "sage"
  paragraphs:
    - "Это психологическая работа. Во время беременности она чаще всего про поддержку и ресурс: помочь с тем, что важно сейчас, а не углубляться в прошлое. Работа помогает справляться с тревогой и неопределённостью, лучше понять свои чувства и подготовиться к переменам с опорой на себя. Она не заменяет наблюдение у врача и не обещает, что беременность или роды пройдут определённым образом. Медицинские вопросы остаются за вашим врачом."
    - "Здесь не нужно становиться «лучшей мамой в мире». Важнее найти, какой мамой хочется быть именно вам и именно для вашего ребёнка, без сравнения и перфекционизма."

medical_note:
  heading: "Когда стоит обратиться к врачу"
  items:
    - "любые изменения в самочувствии и в теле&nbsp;— сразу к своему врачу;"
    - "тревога или подавленность почти не отпускают и мешают спать, есть, заниматься обычными делами;"
    - "пропадает интерес ко всему, что раньше радовало;"
    - "появляются мысли причинить себе вред&nbsp;— тогда обратитесь за помощью сразу."
  extra: "Это не диагноз, а повод обратиться к врачу. Психологическая работа может идти параллельно."

