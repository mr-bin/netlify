faq:
  heading: "Частые вопросы"
  items:
    - q: "Стресс мешает ЭКО? Мне нужно просто расслабиться?"
      a: "Стресс&nbsp;— один из факторов, и не единственный. Он влияет, но не решает. Призыв «просто расслабиться» часто добавляет только вину: «я и это делаю неправильно». В работе мы ищем не «правильное» спокойствие, а то, что поможет легче жить в ожидании: я делаю то, что могу, но не всё могу."
    - q: "Когда лучше прийти: до протокола, во время или после?"
      a: "В любой момент. Кто-то приходит, когда только думает об ЭКО, кто-то&nbsp;— в дни ожидания, после неудачной попытки или в паузе между попытками. Если прошло много времени, прийти тоже можно."
    - q: "Вы скажете, стоит ли пробовать ещё раз?"
      a: "Нет. Решение о следующей попытке или паузе&nbsp;— ваше, и принимаете вы его в том числе с учётом информации врача. Моя задача&nbsp;— помочь услышать разные свои чувства и мысли, чтобы решение стало своим, а не принятым на эмоциях или через силу."
    - q: "Партнёр тоже переживает. Можно прийти вместе?"
      a: "Я работаю индивидуально, совместных сессий для пары нет. Я работаю и с мужчинами, поэтому партнёр может прийти на свою индивидуальную консультацию."
    - q: "Я прохожу ЭКО в другой стране. Подойдёт ли онлайн-формат?"
      a: "Да. Сессии проходят онлайн, на русском языке. Медицина в разных странах устроена по-разному, и медицинских советов я не даю. Но о том, что вы переживаете, можно говорить на родном языке, где бы вы ни были."

zapis:
  lead: "Напишите, с чем хотели бы прийти (можно в двух словах) и какое время вам удобно. Я отвечу в течение одного рабочего дня. Я не служба экстренной помощи: если сейчас очень тяжело, обратитесь к врачу или в местную экстренную службу."
  note: "Перед первой встречей я пришлю информированное согласие. Правило 24 часов и подробности&nbsp;—"
  bg: "lavender"
