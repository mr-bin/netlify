seo:
  title: "Психолог при ЭКО онлайн на русском — Екатерина Заикина"
  description: "Поддержка на пути ЭКО: подготовка, ожидание после переноса, неудачная попытка, решение о паузе. Индивидуально, онлайн, на русском языке."

breadcrumb: "ЭКО"

hero:
  h1: "Психологическая поддержка при ЭКО"
  lead: "Подготовка, протокол, дни ожидания после переноса, неудачная попытка. Пространство, где можно не держаться и поговорить о том, что происходит внутри, пока снаружи всё расписано по дням."
  lead_soft: "Индивидуально, онлайн, на русском языке."
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Когда жизнь расписана по дням"
  paragraphs:
    - "Анализы, уколы по часам, УЗИ, перенос&nbsp;— и дни ожидания, которые тянутся дольше всего. Снаружи ЭКО&nbsp;— это график и рекомендации врача. Внутри&nbsp;— надежда и страх, усталость, иногда злость или зависть, за которые потом стыдно. И да, всё это может быть одновременно."
    - "Бывает, что жизнь будто ставится на паузу: отпуск&nbsp;— «после протокола», встречи&nbsp;— «когда узнаем результат». Хочется контролировать всё, что можно, а многое всё равно остаётся вне нашего контроля."
    - "Стресс&nbsp;— один из факторов, и не единственный. Он влияет, но не решает. Поэтому речь не о том, чтобы «правильно расслабиться», а о том, чтобы на этом пути было на что опереться."
  highlight: "Этот путь проходит не только тело."
  footnote: "Если беременность после ЭКО уже наступила&nbsp;— о поддержке в это время на странице [«Беременность»&nbsp;→](/beremennost/)"

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Решение начать"
      sub: "Сомнения и страхи, «а вдруг не получится», разговор с партнёром"
    - title: "Подготовка и протокол"
      sub: "Усталость, жизнь по графику, ощущение, что всё остальное на паузе"
    - title: "Дни ожидания после переноса"
      sub: "Тревога, бессонные ночи, желание каждый день прислушиваться к себе"
    - title: "Неудачная попытка"
      sub: "Горе и разочарование, вопрос «что я сделала не так?»"
    - title: "Пауза или следующая попытка"
      sub: "Когда нужно решить, что дальше, а чувства тянут в разные стороны"
    - title: "Слова и вопросы близких"
      sub: "«Просто расслабься», «ну когда уже?», кому и сколько рассказывать"
    - title: "ЭКО вдали от дома"
      sub: "Другая страна, медицина устроена иначе, рядом нет привычной поддержки"
  note: "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство"
      text: "Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
    - title: "Точка А и точка Б"
      text: "Что сейчас тяжелее всего и как вы поймёте, что стало хоть немного легче. Это не план и не обещание результата, а ориентир для нашей работы."
    - title: "Место для чувств"
      text: "Тревоге, злости, горю после неудачной попытки нужно место. Говорить можно словами, а можно через рисунок или просто лист бумаги. О каких-то темах можно не говорить&nbsp;— это нормально."
    - title: "Опора на каждом этапе"
      text: "Свои способы справиться с днями ожидания, свои слова для близких, решение о следующем шаге, которое становится вашим. Для самостоятельной работы есть листы «[Когда накрыла тревога](/#list-kogda-nakryla-trevoga)» и «[Моё тёплое одеяло](/#list-teploe-odeyalo)»."

expect:
  heading: "Чего ждать от работы"
  bg: "sage"
  lead: "Работа психологическая. Она не заменяет лечение: медицинские вопросы остаются за вашим врачом, и важно продолжать соблюдать все его рекомендации."
  paragraphs:
    - "Что может измениться:"
  items:
    - "в дни ожидания становится легче жить, даже пока результата ещё нет;"
    - "уходит груз «я должна всё контролировать»&nbsp;— я делаю то, что могу, но не всё могу;"
    - "решение о следующем шаге принимается не на эмоциях и не через силу, а становится своим. И его можно пересмотреть;"
    - "после неудачной попытки у горя появляются место и время."
  callout: "Терапия не гарантирует беременность, но помогает лучше понять себя и двигаться дальше с опорой на себя."

medical_note:
  heading: "Когда стоит обратиться к врачу"
  items:
    - "Любые изменения в самочувствии во время лечения и после пункции или переноса&nbsp;— боль, кровотечение или ощущение, что с телом что-то не так,&nbsp;— повод сразу связаться с клиникой. Для таких случаев клиника даёт контакты, и обращаться туда не стыдно, даже если тревога окажется напрасной."
    - "Тревога или подавленность не отпускают неделями и мешают жить: сну, еде, работе, отношениям."
    - "Горе после неудачной попытки со временем становится не тише, а тяжелее."
    - "Появляются мысли причинить себе вред или что не хочется жить. Тогда&nbsp;— сразу к врачу или в экстренную службу своей страны."
  extra: "Это не диагноз, а повод обратиться к врачу. Психологическая работа может идти параллельно."

