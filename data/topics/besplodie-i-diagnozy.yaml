faq:
  heading: "Частые вопросы"
  items:
    - q: "Сколько обычно длится такая работа?"
      a: "Это зависит от запроса. Мы обсуждаем это на первой встрече и пересматриваем по ходу работы."
    - q: "Можно ли прийти, если диагноза нет, а просто «что-то не так»?"
      a: "Да. Мы будем работать с тем, что беспокоит, и с тем, к чему хочется прийти."
    - q: "Нужно ли говорить врачу, что я работаю с психологом?"
      a: "По вашему желанию. Я соблюдаю конфиденциальность в пределах, описанных в информированном согласии, и связываюсь с врачом только с вашего письменного согласия. Кому и что рассказывать, решаете вы."
    - q: "Если я пойду к психологу, значит, я сама виновата?"
      a: "Нет. Мысль «я сама себя довела»&nbsp;— это про вину. Но вина здесь иррациональна&nbsp;— то есть для неё нет оснований. Действует совокупность факторов, и психологические&nbsp;— лишь часть из них."
    - q: "Нужно ли прекращать лечение?"
      a: "Нет. Важно продолжать работу с врачом и соблюдать все его рекомендации. Исследование психологической сферы&nbsp;— дополнение, а не противопоставление лечению. Я не назначаю и не отменяю лекарства и лечение: это решает врач."

zapis:
  lead: "Напишите, с чем хотели бы прийти (можно в двух словах) и какое время вам удобно. Я отвечу в течение одного рабочего дня. Я не служба экстренной помощи: если сейчас очень тяжело, обратитесь к врачу или в местную экстренную службу."
  note: "Перед первой встречей я пришлю информированное согласие. Правило 24 часов и подробности&nbsp;—"
  bg: "lavender"
