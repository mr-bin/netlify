seo:
  title: "Психолог при бесплодии и диагнозах онлайн на русском — Екатерина Заикина"
  description: "Психологическая поддержка при бесплодии неясного генеза, эндометриозе, миоме, СПКЯ и других диагнозах. Индивидуально, онлайн, на русском языке."

breadcrumb: "Бесплодие и диагнозы"

hero:
  h1: "Психологическая поддержка при бесплодии и гинекологических диагнозах"
  lead: "Бесплодие неясного генеза, эндометриоз, миома, СПКЯ и другие диагнозы: долгое ожидание, сложные решения и жизнь с переменами."
  lead_soft: "Индивидуально, онлайн, на русском языке."
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Что такое репродуктивная психосоматика"
  lead: "Репродуктивная психосоматика исследует, как стресс, наши чувства, переживания и внутренние конфликты могут влиять на репродуктивную сферу: на цикл, зачатие, беременность, роды. Это не поиск вины и не замена медицине, а ещё один способ услышать себя."
  paragraphs:
    - "Даже если какой-то конфликт есть, важно продолжать работу с врачом и соблюдать все его рекомендации. Исследование психологической сферы&nbsp;— это дополнение, а не противопоставление лечению."

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Врач посоветовал поработать с психологом"
      sub: "Хочется понять, с чего начать"
    - title: "Обследования в норме, а беременность не наступает"
      sub: "Долгое ожидание, сомнения, страхи"
    - title: "Диагноз, с которым нужно научиться жить"
      sub: "Эндометриоз, миома, СПКЯ и др. Принять перемены и найти опору"
    - title: "Цикл сбоит после стресса или перемен"
      sub: "При этом работа с врачом продолжается"
    - title: "Мысль «я сама себя довела»"
      sub: "Когда к диагнозу добавляется чувство вины"
    - title: "Часть меня хочет ребёнка, а часть боится"
      sub: "Внутренние сомнения, которые трудно признать"
    - title: "Нужно принять решение"
      sub: "Когда времени мало, например при синдроме истощения яичников: заморозить яйцеклетки, пробовать сразу, выбрать ЭКО или другие вспомогательные репродуктивные технологии, отложить вопрос. Выбор лечения остаётся за вами и врачом, а со мной можно разобраться в чувствах и сомнениях."
    
  note: "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство"
      text: "Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
    - title: "Точка А и точка Б"
      text: "Проясняем, что происходит сейчас, к чему хочется прийти и как мы поймём, что работа получается."
    - title: "Исследуем вашу историю"
      text: "Смотрим, какие переживания и внутренние конфликты могут быть связаны с тем, что происходит, иногда через рисунки и образы. Любая связь&nbsp;— гипотеза: «возможно, а возможно, и нет». Свою историю вы формулируете своими словами."
    - title: "Опора и свои решения"
      text: "Когда внутри тянет в разные стороны, даём голос каждой части и ищем, как их подружить. Решения остаются вашими, а работа с врачом продолжается."

expect:
  heading: "Чего ждать от работы"
  bg: "sage"
  paragraphs:
    - "Это психологическая работа. Она помогает справляться со стрессом, неопределённостью и эмоциями, лучше понять себя и жить с большей опорой на себя. Но она не лечит орган и не гарантирует беременность."
  callout: "Например, при миоме наша работа может помочь лучше понять свои чувства и решения, и это может изменить качество жизни. Сама миома при этом не исчезнет: медицинские вопросы остаются за вашим врачом."

medical_note:
  heading: "Когда стоит обратиться к врачу"
  items:
    - "Любые изменения в теле, вопросы о цикле, здоровье и обследованиях&nbsp;— повод обратиться к врачу. Обращаться туда не стыдно, даже если тревога окажется напрасной."
    - "Тревога или подавленность не отпускают неделями и мешают жить: сну, еде, работе, отношениям."
    - "Кажется, что радоваться больше нечему и всё потеряло смысл."
    - "Появляются мысли причинить себе вред или что не хочется жить. Тогда&nbsp;— сразу к врачу или в экстренную службу своей страны."
  extra: "Это не диагноз, а повод обратиться к врачу. Психологическая работа может идти параллельно."

