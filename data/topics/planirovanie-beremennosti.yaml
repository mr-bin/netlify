seo:
  title: "Психолог при планировании беременности онлайн на русском — Екатерина Заикина"
  description: "Поддержка при планировании и ожидании беременности: решение о ребёнке, тревога, жизнь от цикла к циклу, давление близких. Индивидуально, онлайн, на русском языке."

breadcrumb: "Планирование беременности"

hero:
  h1: "Психологическая поддержка при планировании беременности"
  lead: "Решение о ребёнке, месяцы ожидания, тревога, которая приходит вместе с каждым новым циклом. Пространство, где можно не держаться и поговорить о сомнениях и страхах&nbsp;— и о том, как жить, пока результата ещё нет."
  lead_soft: "Индивидуально, онлайн, на русском языке."
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Месяц за месяцем"
  paragraphs:
    - "Сначала кажется, что всё просто: решили&nbsp;— и получится. А потом жизнь начинает делиться на циклы. Надежда, ожидание, тест&nbsp;— и снова всё сначала. Бывает, что каждый месяц приносит и новую надежду, и новое разочарование. И да, к этому трудно привыкнуть."
    - "Вокруг&nbsp;— советы и вопросы: «просто расслабься», «ну когда уже?». Чужие новости о беременности, после которых радость и боль приходят одновременно. Хочется контролировать всё, что можно: приложения, графики, поиск в интернете. А многое всё равно остаётся вне нашего контроля."
    - "Стресс&nbsp;— один из факторов, и не единственный. Он влияет, но не решает. Поэтому речь не о том, чтобы «правильно расслабиться», а о том, чтобы в ожидании было легче жить: я делаю то, что могу, но не всё могу."
  highlight: "Ожидание&nbsp;— это тоже часть жизни, а не пауза перед ней."
  footnote:
    - "Если обследования уже позади, а причина так и не найдена,&nbsp;— о поддержке в это время на странице [«Бесплодие и диагнозы»&nbsp;→](/besplodie-i-diagnozy/)"
    - "Если впереди или уже идёт ЭКО&nbsp;— на странице [«ЭКО»&nbsp;→](/eko/)"

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Решение о ребёнке"
      sub: "Сомнения, разный темп в паре, страх, что жизнь и отношения изменятся"
    - title: "Жизнь от цикла к циклу"
      sub: "Надежда и разочарование каждый месяц, ощущение, что жизнь на паузе"
    - title: "Тревога и мысли «а вдруг…»"
      sub: "Тесты, приложения, поиск в интернете, бессонные ночи"
    - title: "Отношения в паре"
      sub: "Близость по графику, разные чувства и разные способы справляться"
    - title: "Чужие беременности и вопросы близких"
      sub: "Зависть, за которую стыдно, «просто расслабься», «ну когда уже?»"
    - title: "Вина и сомнения в себе"
      sub: "«Я сама себя довела», «со мной что-то не так», страх, что время уходит"
    - title: "Планирование вдали от дома"
      sub: "Другая страна, медицина устроена иначе, рядом нет привычной поддержки"
  note: "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство"
      text: "Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
    - title: "Точка А и точка Б"
      text: "Что сейчас тяжелее всего и как вы поймёте, что стало хоть немного легче. Это не план и не обещание результата, а ориентир для нашей работы."
    - title: "Ваша история"
      text: "Что для вас значит будущий ребёнок, какие страхи и сомнения стоят рядом с желанием, что вы слышали о родительстве в своей семье. Если какой-то внутренний конфликт найдётся, мы исследуем его бережно, без поиска вины и параллельно с наблюдением у врача. О каких-то темах можно не говорить&nbsp;— это нормально."
    - title: "Опора в ожидании"
      text: "Свои способы прожить дни ожидания и вечер, когда тест снова отрицательный, свои слова для близких, жизнь, которая не стоит на паузе. Для самостоятельной работы есть листы «[Моё тёплое одеяло](/#list-teploe-odeyalo)» и «[Когда накрыла тревога](/#list-kogda-nakryla-trevoga)»."

expect:
  heading: "Чего ждать от работы"
  bg: "sage"
  lead: "Работа психологическая. Она не заменяет лечение: медицинские вопросы остаются за вашим врачом, и важно продолжать соблюдать все его рекомендации. Исследование психологической сферы&nbsp;— это дополнение, а не противопоставление лечению."
  paragraphs:
    - "Что может измениться:"
  items:
    - "в ожидании становится легче жить, и жизнь перестаёт делиться только на «до теста» и «после»;"
    - "уходит груз «я должна всё контролировать»&nbsp;— я делаю то, что могу, но не всё могу;"
    - "становится понятнее, чего хочется вам самим, а что пришло из чужих ожиданий и советов;"
    - "в паре появляется больше места для разговора, а не только для графика."
  callout: "Терапия не гарантирует беременность, но помогает лучше понять себя и двигаться дальше с опорой на себя."

medical_note:
  heading: "Когда стоит обратиться к врачу"
  items:
    - "Любые изменения в теле, вопросы о цикле, здоровье и обследованиях&nbsp;— повод обратиться к врачу. Обращаться туда не стыдно, даже если тревога окажется напрасной."
    - "Тревога или подавленность не отпускают неделями и мешают жить: сну, еде, работе, отношениям."
    - "Кажется, что радоваться больше нечему, а всё, кроме ожидания, потеряло смысл."
    - "Появляются мысли причинить себе вред или что не хочется жить. Тогда&nbsp;— сразу к врачу или в экстренную службу своей страны."
  extra: "Это не диагноз, а повод обратиться к врачу. Психологическая работа может идти параллельно."

