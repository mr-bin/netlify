faq:
  heading: "Частые вопросы"
  items:
    - q: "Мне все говорят «просто расслабься». Это поможет?"
      a: "Стресс&nbsp;— один из факторов, и не единственный. Он влияет, но не решает. Призыв «просто расслабиться» часто добавляет только вину: «я и это делаю неправильно». В работе мы ищем не «правильное» спокойствие, а то, что поможет легче жить в ожидании."
      # Показывается в конце ответа, только когда заполнен video.url.
      if_video: "Подробнее&nbsp;— в видео «[Просто расслабься, и всё получится](#video)»."
    - q: "Может быть, я сама себя довела своими переживаниями?"
      a: "„Я сама себя довела“&nbsp;— это про вину. Но вина здесь иррациональна&nbsp;— то есть для неё нет оснований. Даже если какой-то внутренний конфликт есть, важно продолжать работу с врачом и соблюдать все его рекомендации; исследование психологической сферы&nbsp;— это дополнение, а не противопоставление лечению."
    - q: "Врач говорит, что пока всё в порядке. Можно ли уже прийти?"
      a: "Да. Не нужно ждать диагноза или «достаточно долгого» срока, чтобы прийти. Кто-то приходит, когда только думает о ребёнке, кто-то&nbsp;— после нескольких месяцев ожидания, а кто-то&nbsp;— когда трудно решиться. Если обследования уже позади, а причина не найдена,&nbsp;— о поддержке в это время на странице [«Бесплодие и диагнозы»](/besplodie-i-diagnozy/)."
    - q: "Я пока не уверена, что хочу ребёнка. С этим тоже можно прийти?"
      a: "Да. Сомнения&nbsp;— это не «неправильно». В работе можно спокойно посмотреть, чего хочется вам, чего вы боитесь и что пришло из чужих ожиданий. Решение остаётся вашим."
    - q: "Партнёр тоже переживает. Можно прийти вместе?"
      a: "Я работаю индивидуально, совместных сессий для пары нет. Я работаю и с мужчинами, поэтому партнёр может прийти на свою индивидуальную консультацию."

zapis:
  lead: "Напишите, с чем хотели бы прийти (можно в двух словах) и какое время вам удобно. Я отвечу в течение одного рабочего дня. Я не служба экстренной помощи: если сейчас очень тяжело, обратитесь к врачу или в местную экстренную службу."
  note: "Перед первой встречей я пришлю информированное согласие. Правило 24 часов и подробности&nbsp;—"
