invite:
  heading: "Если хочется разобраться вместе"
  paragraphs:
    - "Практики&nbsp;— способ пережить трудную минуту. А если тревога возвращается снова и снова, можно разобраться с ней вместе: о чём она, что за ней стоит и на что можно опереться в ожидании."
    - "Я работаю онлайн, на русском языке. Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
  # Кнопки нет: «Написать» есть в общем блоке записи сразу ниже.

disclaimer: "Практики на этой странице&nbsp;— для самостоятельной поддержки и не заменяют помощь врача. Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению у врача."
