# ============================================================================
# Страница-подборка «Когда тревожно в ожидании: практики, видео и листы»
# Адрес на сайте: /trevoga-v-ozhidanii/ (определяется именем этого файла).
# Это не обычная тематическая страница, а подборка практик: у неё свой шаблон
# (practices.html.template), его включает строка type: practices ниже.
# Блок «Записаться на консультацию» и подвал — общие, как на тематических
# страницах, в этом файле их нет.
#
# Неразрывные пробелы расставляются сайтом автоматически — вписывать их
# вручную не нужно (кроме неразрывного тире "&nbsp;—").
# Ссылка внутри текста: [текст ссылки](адрес). Жирное начало: **текст**.
#
# КАК ДОБАВИТЬ SHORT К ПРАКТИКЕ, когда он вышел:
#   у нужной практики впишите ссылку в video_url, например
#     video_url: "https://youtube.com/shorts/HuodkAYo7BI"
#   (подходят и ссылки вида youtu.be/..., хвост ?feature=share не мешает).
#   Пустой video_url — ролика на странице нет, ничего больше не выводится.
#   video_title — подпись под роликом.
#
# Любой блок с пустым video.url выводится без видео. Блок листов собирается
# сам из data/materials.yaml — все листы с меткой из sheets.label.
# ============================================================================

type: practices

seo:
  title: "Тревога в ожидании: практики при планировании, ЭКО и в беременности — Екатерина Заикина"
  description: "Короткие практики, когда тревожно перед УЗИ, в дни после переноса или ночью. Без задержек дыхания. Видео и листы для печати, на русском языке."

breadcrumb: "Тревога в ожидании"

hero:
  h1: "Когда тревожно в ожидании: практики, видео и листы"
  lead: "Короткие практики для моментов, когда ждать труднее всего: перед УЗИ, в дни после переноса, ночью."
  # Пусто — то же фото, что на других тематических страницах. Чтобы заменить,
  # впишите адрес картинки, например "/resources/novoe-foto.png".
  image: ""
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Тревога&nbsp;— это реакция на неизвестность"
  paragraphs:
    - "Ждать трудно. Когда планируешь беременность, проходишь ЭКО или уже ждёшь ребёнка, ожидание становится частью жизни: результата, звонка из клиники, следующего УЗИ. И тревога приходит часто именно тогда: в коридоре перед кабинетом, в дни, которые тянутся, ночью, когда в голове крутится «а вдруг…»."
    - "Тревога не значит, что с вами что-то не так. Это реакция на неизвестность и на то, что для вас по-настоящему важно. Иногда к ней добавляется ещё и тревога о тревоге: «а вдруг моё волнение как-то повлияет». Об этом&nbsp;— в видео «Беременным нельзя нервничать?» ниже."
    - "Здесь собраны простые практики, которые можно сделать в коридоре клиники, дома или в постели. Они не убирают неизвестность, но могут помочь пережить трудную минуту и найти опору в том, что происходит сейчас."
  how_to_use:
    title: "Как пользоваться"
    items:
      - "Попробуйте практики заранее, в спокойный момент. Знакомая практика в тревоге вспоминается сама."
      - "Выберите те, что подошли именно вам. Любую можно подстроить под себя."
      - "Задерживать дыхание ни в одной практике не нужно."
      - "При любом дискомфорте остановитесь и вернитесь к обычному дыханию."
      - "После практики похвалите себя: вы сделали что-то для себя, даже если тревога ушла не полностью."
  video:
    url: "https://youtu.be/UO9wdiZF1EY"
    title: "Волнуетесь во время беременности? Тревога и стресс: что нормально, а когда нужна помощь"
    description: "Почему обычная тревога в беременности&nbsp;— норма и когда стоит обратиться за помощью"

medical_note:
  heading: "Сначала&nbsp;— к врачу"
  intro: "Практики помогают пережить тревожную минуту, но не заменяют врача."
  items:
    - "**Любое изменение в теле, которое вас беспокоит,**&nbsp;— повод сразу связаться с врачом, акушеркой или клиникой. Не ждите, пока тревога пройдёт, и не ждите утра. Практики&nbsp;— на время, пока вы ждёте ответа, а не вместо него."
    - "**Если боль сильная, кровотечение обильное, кружится голова или трудно дышать,** сразу вызывайте скорую помощь."
    - "**Если тревога сильная и не проходит,** мешает спать, есть, работать, радоваться, расскажите об этом врачу. Это такая же важная часть здоровья, как анализы."
    - "**Если появляются мысли причинить себе вред** или кажется, что вы не справляетесь, сразу обратитесь к врачу или в местную экстренную службу."
  footnote: "На что обратить внимание во время беременности и после переноса, и место для важных номеров&nbsp;— в листе [«Когда накрыла тревога»&nbsp;→](/#list-kogda-nakryla-trevoga)"

practices:
  heading: "Практики на тревожную минуту"
  situations:
    - title: "В коридоре клиники, перед УЗИ"
      caption: "незаметно, сидя, 1–3 минуты"
      practices:
        - name: "4-3-2-1"
          text: "Медленно, про себя, назовите 4 предмета, которые видите, 4 звука и 4 ощущения в теле. Потом по три, по два и по одному&nbsp;— каждый раз новые. Важно по-настоящему рассмотреть предмет и прислушаться к звуку: внимание переходит с тревожных мыслей на то, что происходит здесь и сейчас. Сбились&nbsp;— просто продолжайте с любого места."
          video_url: "https://youtube.com/shorts/HuodkAYo7BI"
          video_title: "Сидите перед УЗИ, и сердце колотится?"
        - name: "Объятия бабочки"
          text: "Скрестите руки на груди, ладони на плечах. По очереди мягко похлопывайте себя левой и правой рукой, как крыльями, в спокойном темпе. 1–2 минуты или пока не станет легче."
          video_url: "https://youtube.com/shorts/aLuU4_HvZGM"
          video_title: "Что сделать руками, когда тревожно, а рядом люди"
        - name: "Задуть свечу"
          text: "Вдох носом, потом медленный тихий выдох ртом, как будто задуваете свечу на расстоянии вытянутой руки. Выдох длиннее вдоха, без пауз. Три раза по три выдоха, в своём темпе."
          video_url: ""  # Short ещё не вышел — вписать ссылку по выходу
          video_title: "Накрыла тревога? Выдох на тревожную минуту"

    - title: "Дни ожидания результата"
      caption: "после переноса, перед анализом, в ожидании звонка"
      practices:
        - name: "Пять пальцев"
          text: "Обхватите один палец ладонью другой руки, сожмите ощутимо, но не до боли, и скажите себе фразу. Потом следующий палец. Фразы, например: «Такие состояния у меня бывают», «Это тревога ожидания», «Эти состояния заканчиваются», «Я знаю, как себе помочь», «Я прихожу в себя». После пятого пальца переключитесь на спокойное дело, которое выбрали заранее: позвонить близкому, включить музыку, выйти на короткую прогулку."
          video_url: "https://youtube.com/shorts/CYIS1rzEp1k"
          video_title: "Ждёте результата, а дни тянутся? Практика „Пять пальцев“"
        - name: "Спокойное место"
          text: "Вспомните место, где вам было спокойно и безопасно, или придумайте его. Наполните деталями: что вы видите, слышите, чем там пахнет, что чувствуете в теле. Создайте его в спокойный момент и возвращайтесь туда мысленно, когда тревожно. Если какая-то деталь вызывает грусть, просто уберите её из картинки."

    - title: "Ночью, когда не уснуть"
      caption: "лёжа, не будя никого рядом"
      practices:
        - name: "Заметить дыхание"
          text: "Ничего не меняйте, просто заметьте, как вы дышите. Если хочется, делайте выдох чуть длиннее вдоха&nbsp;— без пауз и без счёта, если счёт мешает."
        - name: "Слово покоя"
          text: "Выберите слово, которое звучит для вас спокойно: «тишина», «тепло», «сад». Дышите как обычно: на вдохе мысленно «вдох», на выдохе&nbsp;— своё слово. 3–5 минут."
      # Строка-ссылка в конце ситуации; #teploe-odeyalo — блок «Тёплое одеяло» ниже.
      footnote: "Для долгой ночи&nbsp;— практика [«Тёплое одеяло» ниже&nbsp;↓](#teploe-odeyalo)"

    - title: "Когда крутится «а вдруг…»"
      caption: "в любом месте"
      practices:
        - name: "Мысль&nbsp;— это мысль"
          text: "Заметьте тревожную мысль и добавьте в начале: «У меня есть мысль, что…». Вместо «у меня не получится»&nbsp;— «у меня есть мысль, что у меня не получится». Это уже не факт, а мысль, которая пришла в голову. Она не исчезает, но перестаёт так держать."
          video_url: ""  # Short выходит в субботу — вписать ссылку по выходу
          video_title: "„У меня не получится“&nbsp;— одна фраза для такой мысли"
      # Рамка после практик ситуации.
      note_box:
        title: "Вместо поиска в интернете"
        text: "Ночью и в дни ожидания поиск симптомов и чужих историй чаще усиливает тревогу. Если вопрос важный, запишите его и задайте врачу. Если в теле что-то изменилось, звоните врачу сразу."

  footnote: "Ещё две практики, полные инструкции и личный план на момент тревоги&nbsp;— в листе [«Когда накрыла тревога»&nbsp;→](/#list-kogda-nakryla-trevoga)"

warm_blanket:
  id: "teploe-odeyalo"  # якорь для ссылки из ситуации «Ночью, когда не уснуть»
  heading: "Когда есть время для себя: «Тёплое одеяло»"
  text: "Релаксационное упражнение на 10 минут&nbsp;— для долгого ожидания, когда можно лечь или удобно сесть и никуда не спешить. Вы представляете самое уютное тёплое одеяло, какое нужно именно сейчас, и мысленно укутываетесь им. Упражнение по Людмиле Захаровой."
  small_note: "Не слушайте за рулём и дайте себе немного времени после. Если станет неприятно или тревожнее, можно остановиться."
  video:
    url: "https://youtu.be/1nmHMzSGovE"
    title: "Тёплое одеяло"
    description: "Упражнение в реальном времени: дать себе тепло и опору в дни ожидания"
  footnote: "[«Моё тёплое одеяло»](/#list-teploe-odeyalo)&nbsp;— описать или нарисовать своё одеяло и решить, когда его «доставать»&nbsp;[→](/#list-teploe-odeyalo)"

