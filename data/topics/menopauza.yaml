faq:
  heading: "Частые вопросы"
  items:
    - q: "Менопауза&nbsp;— это про гормоны. Чем тут поможет психолог?"
      a: "Да, перемены этого периода связаны с гормонами. И вместе с тем они влияют на настроение: появляются раздражительность, слёзы, усталость, напряжение. Тело влияет на психику, а психика на тело: то, как женщина относится к переменам, может делать их легче или тяжелее для переживания. Это не про вину, а про то, что здесь есть на что опереться. В работе мы разбираемся, что происходит, и ищем, как вы можете поддержать себя."
    - q: "Я ещё не в менопаузе, но что-то уже меняется. Можно ли прийти?"
      a: "Да. Перемены начинаются раньше, в перименопаузе, и могут идти несколько лет: меньше сил, больше раздражения, слёзы, нервозность. Прийти можно на любом этапе."
    - q: "Говорят, это возраст и надо просто терпеть. Есть ли смысл что-то делать?"
      a: "Многие женщины так и живут, терпят. Часто за этим стоят страх перед лечением или ощущение, что врач не отнесётся всерьёз и отмахнётся. Об этих страхах можно поговорить на встрече: что мешает пойти к врачу и как рассказать ему о своём состоянии. А вопросы о лечении, его пользе и рисках&nbsp;— к врачу."
    - q: "Нужно ли что-то обсудить с врачом до записи? А подскажете, что принимать?"
      a: "Нет, для нашей работы это не обязательно. Если вы уже принимаете назначения врача, прийти тоже можно: я их не корректирую. Лекарства, гормоны и дозировки&nbsp;— это зона ответственности врача, а с вопросами о питании можно обратиться к нутрициологу. Я работаю с чувствами, мыслями и ожиданиями от этого периода."
    - q: "Партнёр не понимает, что со мной. Это можно обсудить?"
      a: "Да. Так бывает часто: близкие привыкли к другому образу и не всегда знают, как говорить, чтобы не задеть. Да и самой женщине не всегда понятно, что с ней происходит. На встречах можно разобраться, что вы чувствуете, и как сказать об этом близким. Я работаю индивидуально, совместных сессий для пары нет."

