seo:
  title: "Психолог при менопаузе онлайн на русском — Екатерина Заикина"
  description: "Поддержка в перименопаузе и менопаузе: раздражительность и слёзы, перемены в теле, вопрос «кто я теперь?» и поиск новых смыслов. Индивидуально, онлайн, на русском языке."

breadcrumb: "Менопауза"

hero:
  h1: "Психологическая поддержка в период менопаузы"
  lead: "Перименопауза и менопауза меняют не только тело, но и ощущение себя. Пространство, где можно не держаться, разобраться, что происходит внутри, и поискать, на что опереться дальше."
  lead_soft: "Индивидуально, онлайн, на русском языке."
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Когда меняется не только тело"
  paragraphs:
    - "Менопауза наступает, когда месячных нет 12 месяцев. Но перемены начинаются раньше, в перименопаузе, и идут не одномоментно, а постепенно, иногда несколько лет."
    - "Тело и настроение связаны. Женщина просыпается слишком рано, не высыпается, весь день чувствует усталость. А вместе с усталостью приходят раздражение, слёзы, напряжение. И сама она не всегда понимает, что с ней происходит, и близкие, которые привыкли к другому её образу."
    - "Бывает, что меняется и что-то глубже: то, как работало до этого, сейчас уже не работает. Появляются вопросы «кто я теперь?» и «а что дальше?»."
    - "Многие привыкли терпеть: «это возраст». И вместе с тем с этим периодом не обязательно оставаться одной."
  highlight: "Это не конец жизни, а новый её период."

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Эмоциональные качели"
      sub: "Раздражительность, слёзы, напряжение, трудно сосредоточиться"
    - title: "Что-то уже меняется"
      sub: "Менопауза ещё не наступила, а сил и спокойствия стало меньше"
    - title: "Перемены в теле и в ощущении себя"
      sub: "Уходят привычная лёгкость и энергия, тело выглядит иначе, и хочется принять себя в своём возрасте"
    - title: "«Кто я теперь?»"
      sub: "Когда внутри звучит «я теперь старая» и вся жизнь видится через эту призму"
    - title: "Не так, как представлялось"
      sub: "В 20–30 лет казалось, что к этому возрасту всё будет иначе: карьера, семья, планы"
    - title: "Когда ребёнок так и не случился"
      sub: "Этот период окончательно закрывает то, на что ещё оставалась надежда, и этой утрате нужно место"
    - title: "А что дальше?"
      sub: "Дети выросли или жизнь просто повернула: новые смыслы и планы, то, от чего раньше отказывалась"
  note: "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство"
      text: "Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
    - title: "Точка А и точка Б"
      text: "С чем вы пришли и что сейчас происходит в вашей жизни, а ещё&nbsp;— каким вы хотели бы видеть итог нашей работы. Иногда разобраться с точкой А&nbsp;— это уже большая часть работы. Это не план и не обещание результата, а ориентир."
    - title: "Ваша история"
      text: "Можно поговорить, а можно нарисовать линию жизни: как вы принимали решения, на какие ценности и сильные стороны опирались. Что-то уже закрыто, и это важно отгоревать. А что-то по-прежнему открыто. О каких-то темах можно не говорить&nbsp;— это нормально."
    - title: "Опора на будущее"
      text: "На что можно опереться теперь и куда направить свою энергию. Жизненный опыт, целеустремлённость, то, что уже сделано, с возрастом никуда не уходят. Для самостоятельной работы есть листы «[Круговая диаграмма ресурсов](/#list-krugovaya-diagramma)» и «[Тело, дом, дерево, предмет](/#list-telo-dom-derevo-predmet)»."

expect:
  heading: "Чего ждать от работы"
  bg: "sage"
  lead: "Работа психологическая. Она не лечит симптомы и не заменяет врача: вопросы о лечении, гормонах и дозировках остаются за ним."
  paragraphs:
    - "Что может измениться:"
  items:
    - "становится понятнее, что со мной происходит и как тело связано с настроением;"
    - "появляются свои способы поддержать себя, когда накрывают раздражение или слёзы;"
    - "прожитая жизнь видится ценной: то, что было сделано, важно, и на это можно опереться;"
    - "становится понятнее, чем наполнить жизнь дальше и что этот период может дать именно вам."
  callout: "Менопауза может проходить по-разному и не всегда легко. И вместе с тем у этого периода есть своё пространство возможностей."

medical_note:
  heading: "Когда стоит обратиться к врачу"
  items:
    - "Перемены в самочувствии беспокоят или мешают жить: сну, работе, отношениям. Врач расскажет, какая помощь возможна. Если вам ещё нет 45, а перемены уже начались, к врачу тоже стоит обратиться."
    - "Любые новые или непривычные изменения в теле&nbsp;— например, учащённое сердцебиение или кровотечение, когда месячных уже не было год и больше,&nbsp;— повод не откладывать визит к врачу, даже если это случилось один раз."
    - "Тревога или подавленность не отпускают неделями и мешают жить."
    - "Появляются мысли причинить себе вред или что не хочется жить. Тогда&nbsp;— сразу к врачу или в экстренную службу своей страны."
  extra: "Это не диагноз, а повод обратиться к врачу. Психологическая работа может идти параллельно."

