seo:
  title: "Психолог за границей онлайн на русском: беременность, ЭКО — Екатерина Заикина"
  description: "Поддержка для тех, кто планирует беременность, проходит ЭКО или ждёт ребёнка в другой стране: одиночество, чужая система, близкие далеко. Индивидуально, онлайн, на русском языке."

breadcrumb: "Вдали от дома"

hero:
  h1: "Психологическая поддержка на пути к материнству вдали от дома"
  lead: "Когда вы планируете беременность, проходите ЭКО или ждёте ребёнка в другой стране, рядом может не оказаться тех, кто обычно поддерживает."
  lead_soft: "Индивидуальные консультации онлайн, на русском языке."
  photo_alt: "Екатерина Заикина"

intro:
  heading: "Вдали от привычной опоры"
  paragraphs:
    - "Дома многое держится само собой: родные, которые могут приехать, подруга, к которой можно зайти без повода, врач, которому всё объясняешь на родном языке. Вдали от дома этого может не быть. И тогда ожидание, тревога перед приёмом, радость, которой хочется поделиться, или потеря проживаются почти в одиночку."
    - "Часто к этому добавляется ещё один слой: другая система здравоохранения, непривычные правила, разговор с врачом на неродном языке, где трудно найти слова для самого важного. А иногда приходит чувство, что и пожаловаться нельзя: «я же сама решила уехать»."
    - "Я сама с 2016 года живу в Англии. У каждой свой опыт и своя история переезда, но что-то из этого мне знакомо не только по работе."
    - "Если вам сейчас так, это не слабость и не неблагодарность. На консультации можно говорить на родном языке и ничего не переводить: ни слова, ни чувства."
  footnote: "Подробнее о каждой теме&nbsp;— на страницах [«Планирование беременности»](/planirovanie-beremennosti/), [«ЭКО»](/eko/), [«Беременность»](/beremennost/) и [«Поддержка после потери беременности»&nbsp;→](/poterya-beremennosti/)"

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Переезд и адаптация"
      sub: "Новая страна, язык, работа, поиск своего места, а посреди всех перемен ещё и мысли о ребёнке."
    - title: "Планирование и ожидание беременности"
      sub: "Ожидание месяц за месяцем, когда рядом нет привычной поддержки."
    - title: "ЭКО в другой стране"
      sub: "Непривычная система и правила, разговоры с клиникой на неродном языке, решения, которые не с кем обсудить."
    - title: "Беременность вдали от своих"
      sub: "Тревога перед приёмами, непривычный порядок наблюдения, мысли о родах и первых месяцах без близких рядом."
    - title: "Потеря беременности вдали от дома"
      sub: "Горе, которым не с кем поделиться рядом, и близкие, которые далеко."
    - title: "Близкие на расстоянии"
      sub: "Одиночество, советы и ожидания родных, вина за то, что вы далеко, вопросы «когда вернётесь?»."
    - title: "Между двумя странами"
      sub: "Где мой дом, какой будет жизнь будущего ребёнка, на каком языке с ним говорить, остаться или вернуться."
  # Две строки — списком, каждая выводится с новой строки.
  note:
    - "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."
    - "По юридическим, миграционным и финансовым вопросам я не консультирую. Решения о своей жизни принимаете вы."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство"
      text: "Первая встреча&nbsp;— интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет. Встречи проходят онлайн, поэтому неважно, в какой стране вы сейчас."
    - title: "Точка А и точка Б"
      text: "Мы смотрим, где вы сейчас и к чему хочется прийти: чтобы было меньше одиночества, больше опоры, ясности в том, чего вы хотите сами."
    - title: "Ваша история"
      text: "Переезд тоже часть вашей истории: почему вы уехали, что оставили дома и что нашли здесь. О прошлом можно говорить столько, сколько хочется, а о каких-то темах можно не говорить совсем."
    - title: "Опора здесь и сейчас"
      text: "Ищем, на что можно опереться в новой стране и в себе: кто рядом, что помогает в трудные дни, что из «дома» можно взять с собой. Для тревожных минут пригодятся листы «[Моё тёплое одеяло](/#list-teploe-odeyalo)» и «[Когда накрыла тревога](/#list-kogda-nakryla-trevoga)»."

expect:
  heading: "Чего ждать от работы"
  bg: "sage"
  paragraphs:
    - "Работа не сделает другую страну родной за несколько встреч и не решит за вас, где жить. Но она может помочь:"
  items:
    - "лучше понять, что вы чувствуете, и назвать это своими словами;"
    - "меньше винить себя за усталость, тоску и «неблагодарность»;"
    - "найти опору в себе и увидеть, на кого можно опереться рядом;"
    - "спокойнее принимать решения (о лечении вместе с врачом, о семье, о будущем) и знать, что их можно пересмотреть."
  callout: "Результат у каждой свой, и он не гарантирован. Решения о своей жизни принимаете вы. Моя задача&nbsp;— помочь вам услышать себя и увидеть ситуацию яснее."

medical_note:
  heading: "Когда стоит обратиться к врачу"
  intro: "Иногда одной психологической поддержки мало, и это не повод стыдиться. Пожалуйста, обратитесь к врачу, если:"
  items:
    - "тоска, грусть или пустота держатся неделями и мешают спать, есть, работать;"
    - "тревога настолько сильная, что трудно выходить из дома, ехать на приём или оставаться одной;"
    - "в теле что-то меняется во время беременности, после процедур ЭКО или после потери: с этим сразу к врачу или в клинику;"
    - "появляются мысли причинить себе вред или кажется, что вы не справляетесь. Пожалуйста, не ждите нашей следующей встречи: обратитесь к врачу или в местную службу экстренной помощи."
  extra: "Если вы ещё не знаете, как устроена помощь в стране, где сейчас живёте, узнайте заранее, куда обращаться в экстренном случае, и запишите номер в телефон. В спокойный день это намного проще, чем в трудный."

