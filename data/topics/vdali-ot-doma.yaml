faq:
  heading: "Частые вопросы"
  items:
    - q: "Я сама решила уехать. Имею ли я право жаловаться?"
      a: "Да. Решение уехать могло быть верным, и всё равно бывает тяжело: одно не отменяет другого. Тоска по дому, усталость, обида не означают неблагодарности, это часть жизни в другой стране. Особенно когда вы идёте к ребёнку и близких не хватает сильнее обычного."
    - q: "Вы помогаете разобраться в медицинской системе или с документами?"
      a: "Нет. Я не консультирую по медицинским, юридическим, миграционным и финансовым вопросам: медицинские вопросы остаются за вашим врачом. Но с тем, что вы чувствуете рядом с этим, прийти можно: растерянность, страх ошибиться, усталость от того, что всё приходится выяснять самой."
    - q: "Мне трудно говорить с врачом на неродном языке. С этим можно прийти?"
      a: "Да. Часто дело не только в словах: в кабинете врача и без того тревожно, а на чужом языке легко потеряться и не спросить главного. На встрече можно разобраться, что для вас важно узнать и сказать, и посмотреть, что поможет чувствовать себя увереннее на приёме. Переводчиком я не буду и на приёмах не присутствую."
    - q: "Родные далеко, но их ожидания и советы всё равно рядом. С этим можно работать?"
      a: "Да. Иногда расстояние не делает такие разговоры легче: вопросы о детях и о возвращении, вина за то, что вы не рядом. Можно разобраться, что из этого ваше, а что пришло из чужих ожиданий. Кому и что рассказывать о своём пути к ребёнку, решаете только вы."
    - q: "Мы думаем, остаться или вернуться. Вы поможете решить?"
      a: "Я не скажу, как правильно: решение останется за вами. Но можно разобраться, что за ним стоит: страхи, надежды, чьи голоса звучат громче вашего. Если вы с партнёром смотрите на это по-разному, можно прийти одной и разобраться в своей части: я веду только индивидуальные консультации."

