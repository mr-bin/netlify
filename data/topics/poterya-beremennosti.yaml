faq:
  heading: "Частые вопросы"
  items:
    - q: "Можно ли прийти, если прошло много времени?"
      a: "Да. Неважно, на каком сроке случилась потеря и сколько времени прошло: месяц или несколько лет. Работа горя — процесс длительный, и боль может возвращаться."
    - q: "Может ли прийти партнёр?"
      a: "Да, индивидуально. Потеря по-своему затрагивает и мужчин, даже когда об этом не принято говорить. С парами я не работаю."
    - q: "Сколько встреч потребуется?"
      a: "Это зависит от запроса. Работа с потерей может занять время. Мы вместе оцениваем это после первой встречи и пересматриваем по ходу работы."
    - q: "Что, если мне тяжело прямо сейчас?"
      a: "Если появляются мысли о том, чтобы причинить себе вред, или состояние очень тяжёлое, в первую очередь обратитесь к врачу или в местную экстренную службу. Психологическая работа может быть рядом, но не вместо этого."
    - q: "Как вы работаете с горем?"
      a: "Я опираюсь на логотерапию и экзистенциальный анализ. В работе с горем для меня важно не «отпустить и забыть», а понять, что для вас значила эта беременность, прожить связанные с ней чувства и найти для потери место в своей жизни. Мы идём в вашем темпе, и каждый проживает горе по-своему."

zapis:
  lead: "Напишите, с чем хотели бы прийти (можно в двух словах) и какое время вам удобно. Я отвечу в течение одного рабочего дня."
  note: "Перед первой встречей я пришлю информированное согласие. Правило 24 часов и подробности&nbsp;—"
