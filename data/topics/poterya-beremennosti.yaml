seo:
  title: "Психолог после потери беременности онлайн на русском — Екатерина Заикина"
  description: "Поддержка после выкидыша, замершей беременности, потери на позднем сроке и прерывания по медицинским показаниям. Индивидуально, онлайн, на русском языке."

breadcrumb: "Потеря беременности"

hero:
  h1: "Поддержка после потери беременности"
  lead: "Выкидыш, замершая и внематочная беременность, потеря на позднем сроке, прерывание по медицинским показаниям."
  lead_soft: "Индивидуально, онлайн, на русском языке. Для женщин и для мужчин."
  photo_alt: "Екатерина Заикина"

warning: "Если вы сейчас беременны, этот текст может отозваться тяжело. Читайте в своём темпе или вернитесь к нему позже."

intro:
  heading: "Об этой боли не всегда говорят вслух"
  paragraphs:
    - "Потеря беременности часто остаётся незаметной для окружающих. Кажется, что жизнь снаружи не изменилась, и от этого ещё труднее признать, что произошло что-то очень важное."
    - "Для многих это не «плод» и не «эмбрион», а ребёнок, даже если срок был совсем небольшим. А для кого-то это прежде всего была беременность: свои ожидания, себя в этом состоянии. И то и другое — ваша правда. Признать потерю и назвать её своими словами — первый шаг, с которого начинается работа горя."
    - "Горю нужно время, иногда до двух лет. Оно идёт не по прямой: боль может возвращаться в дни, которые что-то значили. И переживает её вся семья, каждый по-своему, в том числе партнёр, даже когда об этом не принято говорить."
  highlight: "Боль после потери связана с тем, как много это для вас значило. Ей можно дать место."

topics:
  heading: "С чем можно прийти"
  items:
    - title: "Горе и пустота"
      sub: "Когда не хочется «держаться» и делать вид, что всё прошло"
    - title: "Вина"
      sub: "Мысли «надо было раньше заметить», «если бы я тогда…»"
    - title: "Злость и зависть"
      sub: "Чувства, о которых трудно говорить с близкими"
    - title: "Страх снова планировать"
      sub: "Тревога перед следующей попыткой или беременностью"
    - title: "Отношения в паре"
      sub: "Когда двое переживают одну потерю по-разному"
    - title: "Когда решение принимали вы"
      sub: "Прерывание по медицинским показаниям: горе, о котором особенно трудно говорить"
    - title: "Прошло много времени"
      sub: "Потеря случилась давно, а боль всё ещё рядом"
  note: "Психотерапия не заменяет медицинское лечение и работает как дополнение к наблюдению&nbsp;у врача."

steps:
  heading: "Как может проходить наша работа"
  items:
    - title: "Знакомство."
      text: "Первая встреча — интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
    - title: "Темп выбираете вы."
      text: "О чём-то можно пока не говорить. В любой момент можно сказать «мне нужна пауза», и мы замедлимся."
    - title: "Место для своих чувств."
      text: "Говорить о своём ребёнке или о своей беременности так, как чувствуете вы. Бережно прожить то, что не удалось прожить тогда: грусть, злость, вину. Иногда важно сказать то, что осталось несказанным. Для этого можно, если вам откликается, работать с образами, метафорами, мысленным разговором."
    - title: "Найти место для потери."
      text: "Вместе понять, что эта беременность значила для вас, и что из этого вы хотите сохранить. Горе не исчезает по расписанию, но со временем может стать тише, и потеря займёт своё место в вашей истории."
  footnote_text: "Я писала о работе с горем: статья «Возможности логотерапии при работе с горем», 2020"
  footnote_url: "https://cyberleninka.ru/article/n/vozmozhnosti-logoterapii-pri-rabote-s-gorem"

medical_note:
  heading: "Когда горе — повод обратиться к врачу"
  intro: "Иногда горе переходит в состояние, с которым нужен врач. Повод обратиться к врачу, если две недели и дольше почти каждый день:"
  items:
    - "ничего не радует"
    - "нет сил даже на обычные дела"
    - "нарушились сон или аппетит"
    - "не отпускают чувство вины и ощущение, что вы ничего не стоите"
  extra: "И ещё — если со временем совсем не становится легче, а жизнь как будто остановилась."
  crisis: "Если появляются мысли о том, чтобы причинить себе вред, пожалуйста, не оставайтесь с этим одни: обратитесь к врачу или в местную экстренную службу."

