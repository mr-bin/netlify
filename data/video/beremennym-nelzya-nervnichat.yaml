sections:
  - heading: "Тревожусь из-за того, что тревожусь"
    paragraphs:
      - "Сейчас много говорят о том, как стресс во время беременности влияет на ребёнка. И кажется, что тревожиться нельзя. Но совсем не тревожиться невозможно."
      - "А если женщина уже понервничала, что теперь делать? Сама мысль «тревожиться нельзя» приводит к тревоге о тревоге: «Я тревожусь из-за того, что тревожусь». И цикл замыкается. Как тогда быть?"
  - heading: "Что происходит в теле"
    paragraphs:
      - "Важно понимать: при нормальной беременности уровень кортизола, гормона стресса, к концу срока повышается в 2–3 раза. И это норма, так и должно быть."
      - "Но ребёнок во многом защищён. В плаценте есть фермент 11β-HSD2: он превращает большую часть материнского кортизола в неактивную форму, то есть по сути «гасит» гормон стресса на пути к ребёнку. Тело уже позаботилось об этом."
      - "И здесь важно разделять, что понимают под пренатальным стрессом. Когда в исследованиях говорят о пренатальном стрессе, который может затронуть ребёнка, имеют в виду не обычные тревоги беременных. Речь о сильном и долгом стрессе матери, с которым трудно справиться в одиночку."
      - "Например, потеря или травма, насилие, в том числе дома, затяжные конфликты в семье. Или тревога и депрессия, которые не отпускают неделями. При этом важно не столько само событие, сколько то, как его переживает сама женщина: насколько это тяжело, как долго длится и есть ли рядом тот, кто поддержит."
      - "Считается, что при таком сильном стрессе работа того самого фермента в плаценте может снижаться. И в таких случаях очень важна поддержка: близких, врача, психолога. Именно она помогает с этим справиться."
  - heading: "Что показало исследование"
    paragraphs:
      - "А что с обычной, повседневной тревогой? Учёные из Университета Джонса Хопкинса (DiPietro и соавторы, журнал Child Development, 2006) наблюдали семьи с середины беременности до двух лет ребёнка. В исследование вошли 137 беременных, в два года обследовали 94 ребёнка."
      - "И выяснилось, что лёгкая и умеренная тревога (из разряда «а всё ли в порядке?», «достаточно ли я подготовилась?») развитию детей не навредила. Более того, такие дети в два года показывали даже чуть более раннее двигательное и умственное развитие."
      - "Это не значит, что тревога полезна и её нужно искать, сами авторы об этом предупреждают. Но главный вывод такой: обычные тревоги развитию ребёнка не вредят."
  - heading: "Тревожимся за будущее"
    paragraphs:
      - "Что это даёт? Тревожиться можно. Даже тревожиться из-за того, что потревожилась. Это нормально."
      - "Тревожимся мы чаще всего за будущее: тревога появляется там, где есть неизвестность. И у каждой это по-своему: где-то неизвестного много, а где-то многое уже знакомо, и тревоги меньше. Это тоже нормально."
      - "Когда тревога есть, она подталкивает подготовиться. Иногда она подсказывает, что можно сделать: задать вопрос врачу, сходить на курсы для беременных, договориться с близкими о помощи, подготовить дом."
      - "А иногда сделано всё, что возможно, и остаётся только ждать. Тогда важно поддержать себя в этом ожидании. Для таких моментов есть упражнение «Тёплое одеяло», ссылка на него есть в конце статьи."
  - heading: "Когда стоит обратиться за помощью"
    paragraphs:
      - "И всё же если тревога не отпускает большую часть дня, держится неделями, мешает спать, есть, радоваться, появляются панические атаки, важно рассказать об этом акушерке или врачу."
      - "И можно прийти к психологу. Это не слабость, а забота о себе. При этом важно продолжать наблюдаться у врача и соблюдать все его рекомендации. Работа с психологом — это дополнение, а не противопоставление лечению."
      - "Мне бы очень хотелось, чтобы в период беременности было пространство для всех чувств, и для тревоги тоже."
