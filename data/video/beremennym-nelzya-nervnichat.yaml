title: "Беременным нельзя нервничать? Тревога и стресс в беременности — Екатерина Заикина"
description: "Почему обычная тревога в беременности — это нормально, как тело защищает ребёнка от гормона стресса и когда стоит обратиться за помощью. Текст и видео психолога."
h1: "Беременным нельзя нервничать? Что нормально, а когда нужна помощь"
intro:
  - "«Беременным нельзя нервничать»: эту фразу слышит почти каждая беременная, и от неё часто становится только тревожнее. В этой статье расскажу, что происходит с гормоном стресса во время беременности, что показало исследование об обычной тревоге и развитии детей и когда тревога становится поводом обратиться за помощью. Она для тех, кто ждёт ребёнка и волнуется, в том числе от того, что волнуется."
