sections:
  - heading: "Что такое репродуктивное: две роли"
    paragraphs:
      - "Репродуктивное — это сфера здоровья, в которую входит не только тело. Это и способность создавать близкие, стабильные отношения, и переживания сексуальной сферы, и возможность продолжить потомство."
      - "И здесь перед женщиной открыты две роли: я как женщина и я как мать. У современной женщины эти роли могут присутствовать в разном объёме. Может быть выражена какая-то одна роль или ни одна из них: женщина может выбирать. Поэтому важно разделять эти территории."
      - "В моём обучении есть модель Ирины Викторовны Агеевой, врача-психотерапевта и акушера-гинеколога-эндокринолога, и мне в ней очень откликается идея ролей. Каждая роль, и их сочетание, может звучать по-разному. Быть женщиной: привлекательно или непривлекательно. Быть матерью: роль желанная или обременительная. Быть и женщиной, и матерью: привлекательно и желанно или обременительно и даже опасно."
  - heading: "Когда роли спорят"
    paragraphs:
      - "Между этими ролями может быть конфликт, а может и не быть. Например, какая-то часть женщины хочет ребёнка, а какая-то боится, что материнство заберёт её саму, изменит отношения и той лёгкости, которая есть сейчас, уже не будет."
      - "Такой спор часто идёт неосознанно. И тогда наша задача в работе — дать право голоса каждой из частей: чтобы услышать себя и понять свои потребности. А дальше: подружить эти части и найти решение, которое устроит обе. Как правило, для этого я приглашаю ещё одну, третью часть, которая сможет найти что-то общее между ними и поможет им договориться."
      - "Роли могут занимать в жизни очень разное место. Возьмём два полюса. Одна женщина сфокусирована на целях, на карьере, на построении своего дела. Ей важны развитие и продвижение. Она много читает, ездит на конференции, у неё могут быть хорошие партнёрские отношения. И роль матери для себя она не выбирает. Это её право — строить свою жизнь так, как ей хочется."
      - "Другая женщина весь свой образ жизни выстроила вокруг детей. Если её спросить «Кто я?», первым, скорее всего, прозвучит: «Я мама». Её интересы и заботы крутятся вокруг интересов и забот детей. И где-то она может быть мамой и для партнёра: заботиться о нём, поддерживать, но по-матерински."
      - "А между этими полюсами множество вариантов, и у каждой своя история."
  - heading: "Чьи голоса я слышу"
    paragraphs:
      - "Откуда берутся наши представления о том, какой быть? Образ материнства не появляется в тот момент, когда женщина забеременела. Она подходит к этому уже с багажом: в первую очередь со своим детским опытом."
      - "Что может звучать про женскую роль? Девочка лет пятнадцати собралась куда-то, накрутила волосы, хочет красиво выглядеть, и слышит: «Куда это ты так вырядилась? Кто тебя такую возьмёт?» И девочка может закрыться."
      - "А про материнство? Например, у мамы день рождения, на торте красивая розочка. Её хотят дети, и мама тоже хочет. Но вместо того чтобы сказать: «Ребята, это мой праздник, розочку я возьму себе», — она отдаёт её детям. Если так происходит раз за разом, ребёнок получает послание: стать мамой — значит отказаться от своих желаний, принести себя в жертву."
      - "Бывают и прямые фразы: «Родишь, и жизнь закончится», «Родила тебя, и пришлось бросить институт», «Настоящая женщина — это мать», «Всё лучшее — детям». А иногда послание звучит без слов: мама вздыхает в ответ на просьбы, уставшая, без сил."
      - "И это не про то, что мама плохая. Мамы живые люди, они устают, и так или иначе это бывает в каждой семье. Но у ребёнка ещё нет тех фильтров, чтобы увидеть: за этим стоит мамина усталость, тяжёлый разговор с начальством, её собственная неустроенность. Он берёт это на себя: маме плохо, потому что у неё есть я."
      - "Иногда решение не становиться мамой вырастает именно из этого детского вывода: «маме было бы легче без меня». И дело не в самом решении: у женщины есть право выбирать. Важно, откуда оно принимается: из взрослой части или из напуганного детского состояния."
      - "На сессии мы как раз разделяем: это про маму, а свои выводы женщина может сделать сама. В транзактном анализе это называется перерешением. И это не про то, чтобы уйти в другую крайность и сказать, что материнство — это всегда идеально. Временами это правда бывает тяжело. И в то же время с этим можно справиться."
      - "Бывает и так, что роль матери уже прожита, только не своя. Девочке лет четырнадцати отдают родительскую ответственность за братьев и сестёр, которая ей не по возрасту: она гуляет с ними, пеленает, кормит. И к взрослому возрасту она уже «наигралась»: своих детей не хочет, тема закрыта. Или взрослая женщина становится мамой для собственных родителей, которые нуждаются в её заботе, и тогда тему своего материнства она тоже может закрыть."
  - heading: "Роли меняются"
    paragraphs:
      - "Роли меняются со временем. Когда рождается ребёнок, на сцену естественно выходит «я мама». Это слышно даже по речи: «мы поели, мы погуляли, мы поспали» — хотя всё это делает малыш. Психологическим языком это слияние. И это нормально: для мамы и ребёнка это нужный этап."
      - "При этом «я как женщина» не исчезает. В первые месяцы она может звучать совсем тихо: женщина заботится о себе, ухаживает за кожей, нормально питается. А когда ребёнок подрастает и может побыть с другими близкими взрослыми, эта роль становится чуть больше, ещё чуть больше. На сессиях это звучит так: «Я уже хочу погулять сама», «почитать книгу», «мы с мужем сходили на свидание, а с малышом посидела бабушка»."
      - "Важно не застыть в одной роли, чтобы было и то, и другое. В разных пропорциях, не обязательно пятьдесят на пятьдесят. Условно: в первый месяц 99 на 1, через полгода 80 на 20, через несколько лет 60 на 40. Это баланс на текущий момент."
  - heading: "Что роль значит, и при чём здесь тело"
    paragraphs:
      - "И важно даже не то, как женщина реализует ту или иную роль, а скорее, что эта роль для неё означает. Быть зрелой женщиной — это хорошо? Или тяжело, страшно, опасно? А если я не зрелая взрослая женщина, то кто я?"
      - "И вот здесь роли встречаются с репродуктивной сферой. Если с ролью матери есть внутренний конфликт: одна часть хочет ребёнка, а другая боится, сомневается или не готова, это напряжение может находить отражение в теле: в цикле, в сложностях с зачатием."
      - "И звучать этот конфликт может очень по-разному. «Быть матерью опасно»: у одной женщины за этими словами стоит память о том, как всю семью трясло, когда забеременела старшая сестра. А у другой страх, что партнёр уйдёт. Слова одни, а истории разные. Поэтому свой конфликт каждая формулирует сама."
      - "А если конфликт с ролью женщины, например, когда быть привлекательной кажется тяжело или даже опасно, как у той девочки, которой говорили «Кто тебя такую возьмёт?», это может звучать в интимной сфере: в отношениях со своим телом, в близости, в сексуальности. Иногда в симптомах, которые возвращаются снова и снова, хотя лечение проведено. Как напряжение сказывается на теле, я подробно рассказывала в видео о психосоматике."
      - "Но здесь очень важно слово «может». Это один из факторов, а не причина. Сомнения и страхи бывают практически у всех, в том числе у тех, у кого беременность наступила легко. Поэтому сложности с зачатием не значат, что женщина чего-то «недостаточно хочет»."
      - "И иногда симптом — это просто симптом, и он про медицину. И то и другое может быть правдой одновременно."
  - heading: "Как мы это исследуем"
    paragraphs:
      - "На сессии это всегда следование за женщиной. Я расспрашиваю о детском опыте: какой она видела свою маму, какой мамой мечтала стать. Важно и то, был ли у неё период нянчения: ухаживала ли она за животными, за братьями и сёстрами, как это было для неё и как это подали родители. Одно дело: забота и игра. И другое: когда десятилетнюю девочку оставили с малышом, он расплакался, а она в панике не знает, что делать."
      - "Могу предложить рисунки: я и моя мама в детстве, я и моя мама сейчас, я и мой ребёнок, моя семья в будущем. Или описать каждую роль пятью прилагательными: какая я мама, какая я женщина. Или упражнение «Кто я?»: в свободной форме ответить, кто я или какая я. И посмотреть, звучит ли там «я мама» и как: просто мама? уставшая мама? И звучит ли что-то про женщину: красивая, что-то любит, чем-то интересуется. То есть не только социальная роль, но и то, как она её воплощает."
      - "И это всегда гипотеза: возможно, а возможно, и нет. И даже если какой-то конфликт есть, важно продолжать работу с врачом и соблюдать все его рекомендации."
      - "Если хочется, можно побыть с вопросами ниже. Или не отвечать сейчас: это тоже можно. Если тема материнства сейчас болезненная: после потери, в долгом ожидании, после неудачной попытки, любой из вопросов можно пропустить."
      - "— Что для меня значит быть женщиной?"
      - "— Что для меня значит быть мамой или стать мамой?"
      - "— Что в этих ролях меня радует, а что пугает или кажется тяжёлым?"
      - "— Чьи голоса я слышу, когда думаю об этом?"
