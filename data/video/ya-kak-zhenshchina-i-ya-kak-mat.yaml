title: "Женщина и мама внутри не договариваются? Материнство и роли — Екатерина Заикина"
description: "Почему роли женщины и матери иногда спорят, чьи голоса из детства мы в них слышим, как роли меняются после рождения ребёнка и при чём здесь тело. Текст и видео психолога."
h1: "Женщина и мама внутри не договариваются? Две роли и при чём здесь тело"
intro:
  - "«Я как женщина» и «я как мать» совсем не обязательно одно и то же, и иногда эти две роли внутри не договариваются. В этой статье: что может происходить между ними, откуда мы узнаём, какими им быть, как роли меняются со временем и при чём здесь тело. Она для тех, кто думает о материнстве или сомневается, хочет ли ребёнка, и для тех, кто уже стал мамой и замечает, что «я как женщина» звучит совсем тихо."
video_url: "https://youtu.be/kWEwzzmTEJc"
video_name: "Женщина и мама внутри не договариваются? Материнство, роли и репродуктивная психосоматика"
video_description: "«Я как женщина» и «я как мать» — две разные роли, и иногда они не договариваются. Чьи голоса мы слышим из детства, как роли меняются со временем и при чём здесь тело."
