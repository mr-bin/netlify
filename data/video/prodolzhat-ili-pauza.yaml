# ============================================================================
# Статья к видео. Адрес: /video/<имя файла>/ — после публикации не меняем.
# Как добавить новую: скопировать файл, переименовать, заполнить, собрать, проверить адрес в sitemap.
#
# Подробнее:
# 1. Скопируйте этот файл в data/video/ и переименуйте: имя файла = адрес
#    (только строчные латинские буквы, цифры и дефис; trevoga.yaml → /video/trevoga/).
# 2. Заполните поля. Обязательные: title, description, h1, video_url,
#    sections, crumb, topic, card_text. Необязательные (parent, intro,
#    video_caption, related, cta, duration, card_title) можно удалить — блок
#    просто не выводится.
#    topic и card_text — для карточки на странице «Статьи» (/stati/): topic —
#    ключ группы из data/stati-hub.yaml, card_text — одна строка до 140 знаков;
#    card_title — короткий заголовок карточки, если h1 длинный (без него — h1).
#    title и description — для поисковиков, только обычные пробелы.
#    upload_date — дата и время выхода видео с часовым поясом, в кавычках:
#    "2026-11-02T11:45:06+00:00" (+00:00 — время по Лондону зимой, летом +01:00).
#    upload_date и duration — из YouTube Studio; без upload_date сборка
#    предупредит, и разметка видео для поисковиков не выводится.
#    В related стрелку «→» не пишем — сайт ставит её сам;
#    new_tab: true — ссылка открывается в новой вкладке.
#    cta — одна строка или список абзацев.
# 3. Сохраните — сайт соберётся сам; проверьте адрес в sitemap.xml.
#    show: false — статьи для сайта нет: страница не собирается, её нет
#    в sitemap и на /stati/, обязательные поля не проверяются (но ошибка
#    в синтаксисе yaml остановит сборку). Так готовят статью к ещё не
#    вышедшему видео; когда видео вышло — show: true, video_url, upload_date,
#    duration.
# 4. Неразрывные пробелы (после предлогов и перед тире) сайт ставит сам.
#
show: false   # видео ещё не вышло; при выходе — true и заполнить video_url, upload_date, duration
