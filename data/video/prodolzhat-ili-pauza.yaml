title: "Продолжать или взять паузу? Как принять своё решение — Екатерина Заикина"
description: "Как принять решение о следующей попытке или паузе так, чтобы оно было своим: чувства, три части за столом переговоров и почему решение можно пересмотреть. Текст и видео психолога."
h1: "Продолжать или взять паузу? Как принять решение, которое будет своим"
topic: "ivf"   # группа на странице /stati/ — ключ из data/stati-hub.yaml
card_text: "Как принять решение о следующей попытке или паузе так, чтобы оно было своим, и почему его можно пересмотреть."   # строка для карточки на /stati/, до 140 знаков
intro:
  - "Когда попытки и ожидание тянутся месяцами, а сил становится меньше, однажды появляется вопрос: продолжать или взять паузу? Это текст о том, как принять такое решение, чтобы оно было своим, а не бегством от чувств, и почему его можно пересмотреть. Он для тех, кто проходит ЭКО, пробует естественным путём или думает, идти ли к репродуктологу."
video_url: ""   # после выхода видео
video_name: "Продолжать или взять паузу? Как принять решение, которое будет своим"
video_description: "Как принять решение о следующей попытке или паузе так, чтобы оно было своим: чувства, три эго-состояния за столом переговоров и почему решение можно пересмотреть."
upload_date: ""   # после выхода, из YouTube Studio: дата и время с часовым поясом (ISO 8601), в кавычках
duration: ""   # после выхода, из YouTube Studio, формат ISO 8601 (например PT5M42S)
video_caption: "Если удобнее смотреть — вот видео"
sections:
  - heading: "Когда появляется этот вопрос"
    paragraphs:
      - "Очередная попытка. Месяцы, а может, уже годы ожидания. Встречи с друзьями отменяются, потому что там будут задавать вопросы. Или потому что нельзя алкоголь и снова придётся что-то объяснять. Хочется в отпуск, а впереди опять анализы, клиники и тревога."
      - "Этот вопрос возникает не только в ЭКО. Когда беременность планируется долго и становится тревожно, многие женщины задумываются: продолжать пробовать естественным путём, идти к репродуктологу или отложить эту идею."
      - "Как правило, он приходит, когда сил становится меньше, и физических, и душевных, а иногда не хватает денег или времени. Или когда рядом появилась другая важная задача: в работе, в отношениях."
  - heading: "Две крайности"
    paragraphs:
      - "В принятии решения важно не избегать чувств: они подсказывают, что происходит внутри. И в то же время важно не принимать решение в состоянии, когда чувства переполняют и затапливают."
      - "Бывает решение слишком эмоциональное: «Всё, я устала. Отменю приём у врача и больше никогда»."
      - "А бывает решение слишком холодное, когда чувства остаются без внимания. Усталость уже накопилась, и в теле, и внутри. Раздражение, грусть, тревога подают сигнал, что что-то происходит. Но всё внимание на том, чтобы дойти до цели любой ценой."
  - heading: "Когда чувств слишком много"
    paragraphs:
      - "Когда чувства затапливают, сначала важно дать им выход. Например, взять лист бумаги и в свободной форме, в потоке, писать всё, что приходит: что чувствую, что думаю. Или нарисовать своё состояние."
      - "Задача здесь в том, чтобы выплеснуть, найти канал. Этот лист не нужно перечитывать: решение принимается на другом этапе, а сейчас важно просто дать чувствам выход. Женщина имеет право на такие переживания, и важно найти подходящую форму их выражения."
      - "Бывает, что вопрос «что дальше» появляется сразу после неудачной попытки, когда переживаний особенно много. Тогда важно дать себе время и не принимать решение на этом этапе. Помочь себе: высыпаться, гулять, питаться как обычно, просить поддержки у близких."
      - "Разрешить себе грустить и горевать. И когда состояние станет чуть спокойнее, вернуться к решению. А если чувства не отпускают и мешают жить, это повод обратиться к врачу."
  - heading: "Три части за столом переговоров"
    paragraphs:
      - "В таком решении я опираюсь на транзактный анализ, направление психологии, которое основал Эрик Берн. В нём есть три эго-состояния: Родительское, Взрослое и Детское."
      - "Если очень просто: Детское — про чувства и желания. Родительское — про правила и нормы: что можно, а что нельзя. Взрослое — про факты «здесь и сейчас»."
      - "Важно, чтобы с решением согласилось каждое из них. Они как будто садятся за стол переговоров, как команда, которая принимает решение вместе."
      - "Детское эго-состояние говорит о том, чего хочется сейчас и какие сейчас потребности. Например: «Я хочу встречаться с друзьями, поехать в отпуск, а не снова сдавать анализы, ходить к врачу и тревожиться»."
      - "Родительское говорит о правилах и нормах: «Дети должны быть, как же так». А может и наоборот: «Тебе нужно отдохнуть»."
      - "Взрослое работает как менеджер между Родительской и Детской частью. Где-то помогает им договориться, где-то опирается на цифры, логику, сроки, то есть на то, что объективно."
      - "В идеале все три части согласны. Тогда получается внутреннее согласие, внутренняя договорённость. Такое решение, как правило, приносит облегчение: понятен следующий шаг, напряжение спадает, освобождается ресурс."
      - "Как отличить такое облегчение от решения на эмоциях? Можно представить себя с этим решением в будущем. Если оно принято всеми частями, есть внутреннее спокойствие, уверенность. Если оно принято на эмоциях, облегчение приходит только сейчас, а будущее может пугать или остаётся неуверенность."
  - heading: "Когда части согласны"
    paragraphs:
      - "Как это может звучать? Родительское говорит: «Нужно иметь детей. Мы с мужем договорились». Детское: «Я тоже этого хочу, хочу продолжать». Взрослое: «Следующая процедура тогда-то, она будет стоить столько-то и потребует от меня того-то». Кворум достигнут, решение принято."
      - "А бывает иначе. Детское: «Я хочу гулять, танцевать, а не ходить по клиникам. Хочу на море». Родительское отвечает: «Да, сейчас важнее взять перерыв и отдохнуть, чтобы потом с новыми силами вернуться к этой теме». Взрослое: «Через две недели отпуск. Можно взять паузу на такой-то срок»."
      - "Взрослое отвечает ещё и за срок: на какое время принимается решение и что происходит, когда этот срок заканчивается."
  - heading: "Когда части тянут в разные стороны"
    paragraphs:
      - "Но бывает, что части тянут в разные стороны. Детское говорит: «Я больше так не могу». А Родительское отвечает: «Ничего не знаю, ребёнок должен быть. Если в семье нет ребёнка, зачем такая семья?»"
      - "Возникает внутренний конфликт. Он создаёт напряжение, а на то, чтобы его удерживать, уходит энергия. Поэтому в работе мы даём слово каждой части."
      - "— Сначала Детской: чего хочется и что чувствую? «Хочу отдохнуть. Я устала»."
      - "— Потом Родительской: что можно, а что нельзя? Можно ли взять перерыв, пока цель не достигнута? Или всегда нужно довести до результата?"
      - "— И Взрослой: а что с ресурсами? Сколько сейчас сил, времени, денег. Банально, оплатить анализы."
      - "И ещё о Родительской части: чьи это правила? Иногда в семье звучало: «В нашем роду всегда было много детей». Или то самое: «Семья без детей — не семья». Своё ли это правило или его передали?"
      - "Дальше задача в том, чтобы части договорились, и так, чтобы решение устроило каждую. Например, Родительское говорит: «Ребёнок нужен». Но готово на паузу на месяц-полтора: впереди свадьба у родных и отпуск мужа. У Родительского состояния есть и другая установка: отношения нужно беречь."
      - "Тогда можно прийти к решению: «Я беру паузу на такой-то срок, а потом вернусь и продолжу»."
  - heading: "Если договориться не получается"
    paragraphs:
      - "Здесь многое зависит от ситуации. Бывает, что Родительское звучит очень жёстко: «Ты должна родить ребёнка», а Детское совсем истощено: «Я хочу на ручки». Тогда, скорее всего, конфликт глубже, и это работа со специалистом."
      - "А бывает, что решение ещё не выкристаллизовалось и ему нужно время. Можно оставить тот план, который был изначально. А можно взять время на решение."
      - "Только здесь важно быть честной с собой и продолжать встречаться со своими частями. Иначе это может стать побегом: «решу потом как-нибудь»."
  - heading: "Взрослая часть: сценарии, врач, партнёр"
    paragraphs:
      - "Взрослая часть рассматривает разные сценарии."
      - "— Что даст пауза и что я потеряю? На какой срок? Его женщина задаёт сама."
      - "— А что даст продолжение?"
      - "— Как каждое из решений отразится на партнёре?"
      - "Взрослая часть опирается и на ту информацию, которую дал врач, а где-то запрашивает её дополнительно. Решение женщина принимает для себя сама, с учётом в том числе этой информации."
      - "А если пугает, что время уходит? Здесь важно опираться на факты и помнить, что где-то страх может быть иррациональным, а где-то для него есть объективные причины."
      - "И ещё одно: такое решение редко касается только одного человека. Бывает, что в паре договорились: такие решения принимает женщина, потому что это её тело, и партнёру она сообщает о решении. А бывает, что решают вместе. Тогда за столом переговоров уже шесть эго-состояний: три её и три его."
  - heading: "Решение можно пересмотреть"
    paragraphs:
      - "Услышав чувства, посмотрев на установки и подключив логику, женщина узнаёт о себе больше. И у неё больше возможностей принять решение, которое лучше всего подходит ей сейчас."
      - "Но решение не зацементировано. Его можно пересматривать. Можно заранее договориться с собой:"
      - "— Что должно произойти, чтобы я вернулась и пересмотрела решение?"
      - "— По каким признакам я пойму, что пора?"
      - "И это уже будет новое решение."
      - "Бывает, что через пару лет появляется мысль: «Тогда я совершила ошибку». Но решение принималось из тех знаний, того опыта и той ситуации, которые были в тот момент. Через пару лет и ситуация, и она сама уже другие."
      - "Может быть грусть. А если появится вина, она иррациональна, так как для неё нет оснований."
      - "Решение, которое принимает женщина или мужчина, правильное для них самих в их текущей ситуации. У каждой женщины, у каждой пары своя история."
