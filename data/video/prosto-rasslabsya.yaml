h1: "Говорят «просто расслабься»? Что ответить и как не винить себя"
intro:
  - "«Просто расслабься, и всё получится»: эту фразу слышала, наверное, почти каждая женщина, которая ждёт беременности. От мамы, от подруги, от коллеги. Её говорят с добрыми намерениями, а после неё почему-то становится только тяжелее."
  - "В этой статье: почему эта фраза ранит, как остановить круг вины внутри себя, что ответить близким и незнакомым и правда ли, что всё дело в стрессе. Она для тех, кто планирует беременность или ждёт её."
