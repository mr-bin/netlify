sections:
  - heading: "Почему эта фраза ранит"
    paragraphs:
      - "Здесь, мне кажется, два момента."
      - "Первый: вина. Женщина может услышать в этой фразе: всё, что я делаю, неправильно. Я просто не умею расслабиться, не могу. А вот если бы смогла, у меня бы всё получилось. И возникает чувство вины."
      - "Второй: в этой фразе скрыто обесценивание. Обесценивание всей истории, которая происходит у женщины: того, что она чувствует и что она делает."
  - heading: "Замкнутый круг"
    paragraphs:
      - "Часто женщина и так беспокоится, что не получается. И для неё такое высказывание значит: если что-то идёт не так, значит, со мной что-то не так. Значит, я плохо постаралась и мне надо сделать больше."
      - "И тогда возникает замкнутый круг. «Мне нужно расслабиться». Никто при этом не говорит, как. Не думать о беременности? Но как не думать, если это очень важно? Если бы это не было значимо, женщина бы и не напрягалась."
      - "И вот она фокусируется на том, что ей надо расслабиться ещё больше, и напрягается ещё сильнее, потому что тема становится ещё значимее. На карту поставлена уже не только сама беременность, но и вопрос: а всё ли со мной в порядке?"
  - heading: "Клубок чувств"
    paragraphs:
      - "Это напряжение создаёт ещё больший стресс, и тема становится эмоционально заряженной. Тут и вина, и стыд, и злость, и раздражение на окружающих, и в то же время вина за это раздражение. И тревога: а когда получится?"
      - "Если такие чувства знакомы, так бывает, когда что-то по-настоящему важно."
  - heading: "Как остановить круг внутри себя"
    paragraphs:
      - "Что же делать, когда близкие говорят «просто расслабься»? В первую очередь важно этот круг (вину, напряжение, злость, разочарование) не запустить, а остановить внутри себя. Не обесценить то, что уже делаешь."
      - "Можно исходить из того, что близкие, если мы с ними в более-менее ровных, хороших отношениях, переживают и хотят поддержать. Но в то же время не находят нужных слов. Тот, кто говорит «просто расслабься», хочет дать совет и при этом не знает какой. Возможно, за этим его собственная беспомощность: хочется помочь, но непонятно как."
      - "Это ни в коем случае его не оправдывает. Но позиция «это что-то о нём, а не обо мне» помогает выдержать обесценивание внутри. Да, другой обесценил. Но это о нём. А у меня есть внутренняя опора: я делаю достаточно для своей ситуации."
  - heading: "Что ответить близким и незнакомым"
    paragraphs:
      - "А дальше можно ответить с уважением и к себе, и к другому. Например, близкому человеку: «Ты очень хочешь меня поддержать и даёшь совет, который кажется тебе полезным. При этом мне он не помогает, и я чувствую себя уязвимо. Мне сейчас важнее, чтобы ты просто был или была рядом»."
      - "Здесь важно, насколько отношения позволяют озвучивать свои чувства и просьбу. Если это не близкий человек, объяснять и вдаваться в детали не нужно. Эту тему можно вообще не раскрывать и остановить разговор: «Я не готова это обсуждать»."
      - "То есть многое зависит от того, кто это говорит и какие с ним отношения. Но, повторюсь, в первую очередь важно не дать этому кругу раскрутиться внутри себя."
  - heading: "Всё дело в стрессе?"
    paragraphs:
      - "«Это всё от стресса»: так часто говорят женщине, которая ждёт беременности. Правда ли, что стресс сказывается на теле? Да. Но стресс — один из факторов, и не единственный. Он влияет, но не решает."
      - "И если в голове звучит «я сама себя довела», то это про вину. Но вина здесь иррациональна, то есть для неё нет оснований."
      - "И ещё одно: чем больше стараешься расслабиться, тем меньше это получается."
  - heading: "Не значимость, а сверхзначимость"
    paragraphs:
      - "Поэтому задача не в том, чтобы снизить значимость беременности. А в том, чтобы снизить её сверхзначимость: вернуть значимость другим сферам жизни. Ведь, скорее всего, помимо беременности для женщины важно и что-то ещё."
      - "Например, ей нравится читать, и на сессии мы можем говорить об этом больше. Или ей важны порядок и уют в доме: как она их создаёт и что делает для этого сейчас. Или ей важен активный образ жизни: выставки, музеи, лекции об искусстве. А сейчас тема беременности настолько захватила, что она только о ней и читает, форумы и статьи, и кажется, что вся жизнь только о беременности."
      - "И тогда я спрашиваю: а что было раньше? И мы понемногу возвращаем это в её жизнь: может быть, есть выставка или лекция, на которую можно сходить уже сейчас."
      - "Просто «расслабься» правда не сработает: мысли крутятся вокруг одной темы. Но когда добавляются другие мысли, о важном и, может быть, о приятном, сверхзначимость беременности может снижаться сама собой. И жизнь может ощущаться полнее."
  - heading: "Истории про отпуск"
    paragraphs:
      - "«Перестала стараться, и сразу получилось». «Съездили в отпуск, и забеременела». Такие истории слышали, наверное, многие. Но, как мне кажется, за ними стоит не то, что женщина как-то правильно расслабилась. А то, что она добавила в свою жизнь что-то ещё."
      - "И это не панацея. План «поеду в отпуск, чтобы забеременеть» может не сработать, потому что это всё та же сверхзначимость беременности. Историй «съездила в отпуск, и не получилось» мы не слышим. Но это не значит, что их нет."
      - "Поэтому мы добавляем что-то в жизнь не ради беременности, а ради самой жизни: потому что это важно и ценно. Без оглядки на то, приведёт ли это к беременности. Беременность может наступить, а может и не наступить."
  - heading: "Контроль и принятие"
    paragraphs:
      - "Но самое важное — это работа с идеей контроля. Бывает, что каждый месяц пара делает всё по плану, а беременность снова не наступает. Процессы зачатия мы не можем полностью контролировать. Беременность не наступит просто потому, что я очень этого хочу. Это та область, где многое действует вне зоны нашего контроля."
      - "И когда отпускаешь саму идею, что этот процесс можно проконтролировать, расслабление может прийти естественным образом. Я принимаю, что есть вещи, которые от меня не зависят. Это внутреннее принятие. И женщина перестаёт рассматривать себя «под лупой»."
      - "И это не про пассивное ожидание. Я делаю то, что могу. Но не всё могу. И когда уходит ощущение «я всемогущая», уходит и огромный груз."
      - "И важно: принятие не гарантирует, что беременность наступит: на неё влияет много разных факторов. Это про то, чтобы в ожидании было легче жить."
      - "На сессиях здесь может подниматься и тема контроля в целом. А где женщина ещё контролирует? А где не контролирует и относится к этому спокойно? Например, погода за окном завтра будет такой, а не той, какой ей бы хотелось. Во время дождя она возьмёт зонтик, и проблема будет решена."
      - "Погоду мы не выбираем. Но зонтик можно взять с собой."
