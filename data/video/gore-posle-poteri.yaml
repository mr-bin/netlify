sections:
  - heading: "«Посмотри на него»: признание потери"
    paragraphs:
      - "Несколько лет назад я прочла книгу Анны Старобинец «Посмотри на него». Автор рассказывает, как пережила прерывание беременности по медицинским показаниям на сроке двадцать недель. Книга тяжёлая, и беременным и тем, кто планирует детей, я бы её сейчас не советовала. Но в ней есть моменты как раз про то, с чем встречается человек после потери."
      - "Само название — это слова, которые героиня слышит от врача и психолога после родов. Сначала она не решается посмотреть: боится увидеть что-то, с чем не сможет потом жить. И находит мужество сделать это на следующий день: попрощаться с сыном."
      - "Почему это так важно? Потому что в этот момент происходит признание: беременность была, ребёнок был, и теперь его нет. По сути, это ритуал. Но ритуал очень нужный, чтобы запустилась работа горя. Чтобы человек не застрял в отрицании, когда кажется: «Ну ничего же не изменилось. Как жила, так и живу»."
      - "И важно отметить: прощание у каждого может быть своим. Важно, чтобы каждый мог отгоревать то, что нужно отгоревать именно ему. И сделать это можно и спустя время."
  - heading: "Ребёнок, а не «плод»"
    paragraphs:
      - "Для героини это действительно ребёнок, малыш. А слово «плод», которое употребляют врачи, её очень ранит."
      - "Я вспоминаю случай, который мы обсуждали на обучении: у женщины произошёл выкидыш на раннем сроке. И ей было важно говорить именно о ребёнке, а не об эмбрионе. Для неё это правда человек, пусть ему и было шесть недель. А она правда мама, пусть и на короткий миг."
      - "Но так бывает не у всех. Иногда женщины переживают потерю именно как «я была беременной», а не «я вынашивала ребёнка». И это тоже имеет место быть. Тогда мы работаем с теми смыслами, которые вкладывает сама женщина. В работе я следую за ней: за её ожиданиями, за тем, что сама беременность для неё значила."
      - "Если женщина чувствует, что это был ребёнок, ей можно называть своего ребёнка ребёнком. А если для неё это прежде всего была беременность, это тоже её правда. И в любом случае горевать можно, даже если срок был совсем маленьким, даже если вокруг никто об этом не знал. И даже если решение пришлось принимать самой."
  - heading: "Горю нужно время"
    paragraphs:
      - "Процесс работы горя длительный. На практике он может занимать до двух лет."
      - "Часто кажется: ну раз месяц прошёл, то уже не должно быть боли, не должно быть слёз. И кажется, что говорить об этом уже лишнее. Но горе так не устроено."
      - "Есть известные стадии горя, которые описала Элизабет Кюблер-Росс: отрицание, гнев, торг, депрессия, принятие. Но по сути это не лестница, где идёшь ступенька за ступенькой. Процесс этот нелинейный и очень индивидуальный. Какая-то стадия длится дольше, какая-то короче, какую-то можно и не заметить, а можно и вернуться назад."
      - "Бывает, что вроде бы уже спокойно, а потом слышишь рекламу детской одежды, и подкатывают слёзы. И это нормально. Нет правильного срока и правильного способа горевать."
      - "Особенно трудно бывает в даты, которые что-то значили. В книге героиня как раз в то время, когда ребёнок должен был бы родиться, сталкивается с паническими атаками. Так проявляется то, что не удалось прожить. И если в такие дни вдруг становится хуже, чем было неделю назад, это не значит, что что-то не так. Это горе напоминает о себе."
  - heading: "Горькая чаша"
    paragraphs:
      - "Иногда горе похоже на горькую чашу, которую приходится пить глоток за глотком. Временами очень больно, временами тише, и кажется, что это никогда не закончится. Но наступает момент, когда уже можно вспоминать, смотреть фотографии времён беременности и испытывать светлую грусть. Этот кусочек жизни встраивается в жизненный опыт. И пить эту чашу легче, когда рядом есть кто-то, с кем можно разделить переживания."
  - heading: "Каждый в семье переживает по-своему"
    paragraphs:
      - "Женщина в такой момент очень уязвима. Героиня, когда узнаёт заключение врача УЗИ, не может найти выход из поликлиники. И чтобы справиться с утратой, нужно достаточно поддержки."
      - "И ещё одно. Хотя физически через это проходит женщина, так или иначе переживает вся семья: партнёр, старшие дети, у каждого свой процесс. Иногда мужчине кажется, что он должен держаться и быть опорой, и для своего горя не остаётся места. Иногда близкие молчат, потому что боятся сделать больнее. И тогда каждый остаётся один на один со своей болью."
      - "Мне бы очень хотелось, чтобы у каждого, кто проходит через потерю, было пространство для своих чувств. Для слёз, для злости, для вины, для растерянности. Место, где можно не держаться."
  - heading: "Когда горе — повод обратиться к врачу"
    paragraphs:
      - "Иногда горе переходит в депрессию, уже не как этап, а как состояние, с которым нужен врач. Повод обратиться к врачу, если две недели и дольше почти каждый день:"
      - "— ничего не радует;"
      - "— нет сил даже на обычные дела;"
      - "— нарушились сон или аппетит;"
      - "— не отпускают чувство вины и ощущение, что ничего не стоишь."
      - "И ещё: если со временем совсем не становится легче, а жизнь как будто остановилась."
      - "Если вам сейчас очень тяжело или появляются мысли о том, чтобы причинить себе вред, пожалуйста, не оставайтесь с этим один на один. Обратитесь к врачу или в местную экстренную службу."
