intro:
  - "Это статья о потере беременности. Если вы сейчас ждёте ребёнка или вам тяжело об этом читать, её можно отложить и вернуться к ней позже."
  - "Потеря беременности на шестой неделе или на двадцатой — это потеря. Но часто кажется, что горевать уже не положено: срок был маленький, прошёл месяц, никто не знал. В этой статье: почему эту потерю важно признать, сколько времени нужно горю, как по-своему переживает вся семья и когда горе становится поводом обратиться к врачу."
