description: "Почему потерю беременности на любом сроке важно признать, сколько времени нужно горю, как переживает вся семья и когда горе — повод обратиться к врачу. Текст и видео психолога."
h1: "Прошёл месяц, а всё ещё больно? Почему горю после потери беременности нужно время"
