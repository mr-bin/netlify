cta:
  - "Если вы сейчас на пути к родительству вдали от дома, в другой стране или в другом городе, и вам тревожно, одиноко или вы злитесь на то, как всё устроено, вы не одни. Приходите с вашей историей, какой бы она ни была. Мы можем вместе посмотреть, что может дать опору именно вам."
  - "Консультации проходят онлайн. Первая встреча — интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
  - "Мне бы очень хотелось, чтобы у вас было место, где можно не держаться."
