title: "Тяжело вдали от дома? Беременность, ЭКО и три опоры — Екатерина Заикина"
description: "Почему злость и растерянность на новом месте — часть адаптации и что может стать опорой на пути к родительству в другой стране или другом городе. Текст и видео психолога."
h1: "Тяжело вдали от дома? Беременность, ЭКО и три опоры"
topic: "away"   # группа на странице /stati/ — ключ из data/stati-hub.yaml
card_text: "Почему злость и растерянность вдали от дома — часть адаптации и какие три опоры могут помочь на пути к родительству."   # строка для карточки на /stati/, до 140 знаков
intro:
  - "Ночь, очень сильная боль, а по телефону скорая говорит: «Доберитесь до больницы сами». Так было со мной в первый год после переезда в Англию. Когда путь к родительству проходит вдали от дома, при планировании беременности, ЭКО или в ожидании ребёнка, часто знакомо это чувство: всё устроено иначе, и непонятно, на что опереться. В этой статье — почему злость и растерянность здесь нормальны и три опоры, с которыми я работаю в терапии."
video_url: "https://youtu.be/WROzKToNBCo"   # после выхода видео
video_name: "Тяжело вдали от дома? Беременность, ЭКО и три опоры"
video_description: "Почему на пути к родительству вдали от дома злость и растерянность нормальны и какие три опоры могут помочь: место для чувств, «для чего» и конкретные шаги."
upload_date: "2026-11-30T08:00:00+00:00"   # после выхода, из YouTube Studio: дата и время с часовым поясом (ISO 8601), в кавычках
duration: "PT6M28S"   # после выхода, из YouTube Studio, формат ISO 8601 (например PT5M42S)
video_caption: "Если удобнее смотреть — вот видео"
sections:
  - heading: "Вдали от дома: не только другая страна"
    paragraphs:
      - "«Вдали от дома» не обязательно означает другую страну. Моя беременность и роды проходили в стране, где я родилась. Но за полгода до родов мы переехали в другой город, где я до этого не жила, и мне пришлось всё узнавать заново: консультацию, больницу, район, окружение."
      - "Когда беременность планируется, идёт ЭКО или ожидание ребёнка в новом месте, задачи, так или иначе, две сразу. Одна — сам путь к родительству. Другая — освоиться там, где пока не всё знакомо."
      - "И это нагрузка, даже если снаружи кажется, что ничего особенного не произошло."
  - heading: "Когда медицина устроена иначе"
    paragraphs:
      - "В другой стране к этому добавляется ещё и другая медицинская система. Вот та ночь, с которой я начала. У меня обострилось хроническое заболевание, боли были очень сильные."
      - "Дети были маленькие, муж остался с ними, и ехать мне пришлось самой: скорая не приехала. До больницы 40 минут на машине, в другой город. В приёмном покое я ждала врача три часа, а потом мне дали сильное обезболивающее и отпустили: утром идти к своему врачу общей практики, GP."
      - "А я ожидала совсем другого, привычного для меня: что меня посмотрят, положат в больницу. И было ощущение растерянности: а всё ли в порядке? А вдруг что-то упустили? А вдруг я не объяснила толком?"
      - "Очень сложно объяснить своё состояние, когда не хватает языка, а внутри сильное напряжение, тревога, и ещё физически плохо."
      - "Это мой опыт. И важно сказать: у каждого он свой, и своя история. Кому-то встреча с медициной в новой стране даётся легче, кому-то тяжелее, и нет правильного или неправильного способа это переживать."
      - "На пути к родительству встреч с врачами много: обследования, протоколы, наблюдение. И каждая такая встреча в другой стране может поднимать то же самое: напряжение, тревогу, ощущение, что не поняли до конца."
  - heading: "Первая опора: место для чувств"
    paragraphs:
      - "Что помогает? В терапии я работаю с тремя опорами. Первая — место для чувств."
      - "Расскажу, что я замечаю в себе. Когда мои ожидания (а они есть, потому что я знаю, как это работало в моей стране) сталкиваются с тем, как это устроено в Британии, это вызывает очень сильную злость, раздражение. Почему именно так? Почему нельзя сделать по-нормальному?"
      - "Потом эта злость сменяется грустью: но я нахожусь здесь, а не там. И здесь выстроена другая система. И уже после этого приходит принятие."
      - "Иногда это происходит очень быстро, с пропуском каких-то стадий. Это похоже на процесс горевания: мы как будто прощаемся с тем, как было привычно."
      - "Злость на то, как всё устроено на новом месте, не значит, что с человеком что-то не так. Это часть адаптации. И злости, и грусти можно дать место."
      - "В работе я признаю чувства клиента и даю им пространство: и злости, и обиде, и тревоге, и чувству несправедливости. Чтобы человек мог это выгрузить. И только после этого, когда эмоциональная часть немного отделилась, мы идём дальше."
  - heading: "Вторая опора: для чего"
    paragraphs:
      - "Вторая опора — «для чего», то есть смыслы и ценности. Клиенты, которые переехали недавно, примерно до трёх лет назад, часто говорят, что дома всё было понятно и идеально. Хотя когда мы начинаем разбирать, оказывается, что и там были свои особенности."
      - "Многое зависит от того, был ли переезд вынужденным или желанным. Можно спросить себя:"
      - "— Как я отношусь к своему переезду?"
      - "— Чем он был для меня?"
      - "Когда понятно, для чего был этот переезд, легче справиться с тем, что здесь всё устроено иначе. И легче найти то, за что можно зацепиться."
      - "То же самое с разговором с врачом. Внутри такой ситуации очень много напряжения. Но если посмотреть на то, что я разговариваю с врачом, чтобы получить информацию, чтобы сделать что-то для своего здоровья, потому что это важно для меня, тогда это помогает справляться и с шероховатостями в языке, и с недопониманием. Это даёт опору и уверенность."
  - heading: "Третья опора: конкретные шаги"
    paragraphs:
      - "Третья опора — конкретные шаги. Когда понятно, для чего, легче понять и что делать."
      - "Можно спросить коллег, друзей: как правило, у человека уже складывается какое-то окружение. Банальный интернет никто не отменял. То есть мы намечаем, что можно сделать в этой ситуации."
