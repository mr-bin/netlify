#    topic и card_text — для карточки на странице «Статьи» (/stati/): topic —
#    ключ группы из data/stati-hub.yaml, card_text — одна строка до 140 знаков;
#    card_title — короткий заголовок карточки, если h1 длинный (без него — h1).
#    title и description — для поисковиков, только обычные пробелы.
#    upload_date — дата и время выхода видео с часовым поясом, в кавычках:
#    "2026-11-02T11:45:06+00:00" (+00:00 — время по Лондону зимой, летом +01:00).
#    upload_date и duration — из YouTube Studio; без upload_date сборка
#    предупредит, и разметка видео для поисковиков не выводится.
#    В related стрелку «→» не пишем — сайт ставит её сам;
#    new_tab: true — ссылка открывается в новой вкладке.
