intro:
  - "Под Новый год вокруг очень много итогов: списки сделанного за год, планы на следующий, чьи-то фотографии с детьми или новость, что ребёнок скоро появится. А внутри звучит: «опять год, а не получилось». В этой статье: почему беременность лучше не ставить целью на новый год и что поставить вместо неё, как подвести итоги, чтобы год не свёлся к одному пункту, и стоит ли загадывать желание, если страшно, что оно опять не сбудется."
