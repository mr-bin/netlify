sections:
  - heading: "Почему беременность — не цель"
    paragraphs:
      - "Когда женщина или пара ставит себе на новый год цель «забеременеть» или «родить ребёнка», здесь есть ловушка. Такая цель скорее мешает, чем помогает."
      - "Почему? Цель, которая помогает, обычно зависит от нас, и у неё есть понятный срок. А забеременеть или родить к определённой дате невозможно: это зависит не только от нашего желания и усилий. Ведь здесь участвует ещё один человек, сам ребёнок."
      - "Как тогда ставить цель? Здесь очень важно отделить её от результата. Цель «забеременеть» можно переформулировать: «сделать то, что от меня зависит, на пути к беременности». И тогда это уже конкретные шаги, которым можно поставить срок: сходить к врачу, пройти обследование, выполнять его рекомендации. Это в наших руках. А результат — не только в наших."
  - heading: "Цель на своё состояние"
    paragraphs:
      - "А ещё можно поставить цель на своё состояние: какое состояние хочется чувствовать в новом году и что для этого нужно. Какие конкретные действия можно делать регулярно и по каким признакам понять, что получается. Это не заменяет желание иметь ребёнка. Это про то, чтобы в ожидании было легче жить."
      - "Например, женщина хочет ощущать умиротворение, гармонию. Тогда можно поискать: «А что я уже делаю, что вызывает у меня это состояние?» Гуляю по парку. Смотрю на воду. Зажигаю дома свечи, наполняю дом приятными запахами. Сажаю цветы или покупаю их и ставлю дома, и глаз радуется."
      - "Эти действия можно прописать, а затем практиковать регулярно. Так шаг за шагом это состояние может стать привычным."
      - "А как понять, что получается? Тоже по конкретным признакам: «я больше высыпаюсь», «я чаще улыбаюсь», «я спокойнее реагирую на неудачи». Это не значит, что при любой неприятности я сразу поймаю дзен. Но так или иначе я смогу быстрее возвращаться в это состояние."
  - heading: "Как подвести итоги, если цель была одна"
    paragraphs:
      - "Теперь об итогах. Здесь важно, какие цели ставились на этот год и по каким признакам можно понять, что они достигнуты."
      - "Если цель была одна, забеременеть, а это не получилось, разочарование может быть очень сильным. И здесь важно сначала дать место грусти: «Я так надеялась, что в этом году забеременею. Этого не случилось, и мне правда очень жаль». А уже потом подводить итоги."
      - "И вместе с тем в жизни есть и другое, что важно. Что ещё значимо? Отношения, друзья, работа, поездки, развитие, хобби: всё, что приходит в голову. И по каждой сфере можно спросить себя:"
      - "— Что я приобрела?"
      - "— Какой опыт получила?"
      - "— Что узнала о себе нового?"
      - "— С кем познакомилась?"
      - "— Что уже поменялось?"
  - heading: "Львица и мышь"
    paragraphs:
      - "Подойти к итогам можно и через образ или рисунок. Например, представить или нарисовать: кем я была год назад, если бы я была животным? Кто я сейчас? И каким животным хочу быть через год? Так видно, что изменилось."
      - "И женщина может сказать: «Год назад у меня всё было шикарно, я чувствовала себя львицей. А сейчас, из-за того что не получилось, не справилась, не забеременела, я чувствую себя загнанной уставшей мышью»."
      - "Мышь устала, и это правда. И вместе с тем у мыши тоже есть свой ресурс. Она маленькая, но юркая и ловкая: пролезает туда, куда большой зверь не пройдёт. Как в басне «Лев и мышь»: именно мышь перегрызла верёвку и освободила льва. Может быть, ресурс женщины сейчас как раз в этом, в гибкости: она научилась искать обходные пути, перестраивать планы, пробовать по-другому."
      - "И что-то ещё этот опыт дал. Возможно, теперь она знает больше о своём теле. Возможно, за время планирования поменялись отношения с партнёром. Да, для пары это достаточно тяжёлое время. Но, может быть, они стали ближе: больше говорят друг с другом, больше времени проводят вместе."
  - heading: "Когда всё видится через тёмный фильтр"
    paragraphs:
      - "А бывает, что всё кажется плохим: и отношения с партнёром ухудшились, и на работе стало хуже, и беременность не наступила. Как будто женщина смотрит на свою жизнь через тёмный фильтр, и всё видится в одном цвете: «в моей жизни ничего не получилось»."
      - "За этим стоит много боли, разочарования и грусти. Их важно признать и прожить, и уже потом посмотреть, что там ещё, за этим фильтром."
      - "Можно честно спросить себя и свериться с фактами: «А так ли это на самом деле?» Может быть, в каких-то областях правда не получилось достичь того, чего хотелось. И в то же время: что этот опыт мне даёт?"
  - heading: "Круговая диаграмма ресурсов"
    paragraphs:
      - "А чтобы заглянуть в следующий год, есть упражнение «Круговая диаграмма ресурсов». Рисуется круг, и в нём мы смотрим, как сейчас распределяются ресурсы (время, силы, внимание, деньги): на какие сферы они уходят. Важно, что названия сфер каждый даёт сам."
      - "Нарисовали, посмотрели, проанализировали, и задаём себе вопрос: «А как бы мне хотелось?» И рисуем круг заново: как бы мне хотелось распределять свои силы, время и внимание. А уже потом смотрим, как к этому можно прийти."
      - "Из этого и ставятся цели. Но опять же такие, которые зависят от нас: чтобы было понятно, что делать и как понять, что цель достигнута. Лист «Круговая диаграмма ресурсов» с вопросами и примерами есть на сайте, ссылка на него в конце статьи."
  - heading: "Загадывать ли желание"
    paragraphs:
      - "И ещё один вопрос, который возникает перед Новым годом: загадывать ли желание? «Боюсь загадывать: вдруг опять не сбудется»."
      - "Здесь важно, что я вкладываю в это желание. Загадать желание может быть правда очень красивым ритуалом. Ритуалы нужны для нашей психики: они могут снижать тревогу и давать почувствовать некую определённость. Написала желание на бумаге, сожгла его под бой курантов. Если это придаёт сил, уверенности, помогает, то почему бы и нет."
      - "Но если желание вызывает напряжение, нервозность: «Я загадала, и если оно не сбудется…», «если не сейчас, то больше никогда», это уже про сверхзначимость. То есть когда кажется, что от одного события зависит всё. Тогда такой ритуал только повышает тревогу."
      - "Можно посмотреть на желание просто как на желание, а не переводить его в цель. Нет такого, что если я загадаю, оно сбудется, а если не загадаю, то нет. Здесь связи нет. И если женщина уже боится загадывать, можно и не загадывать. На результат это не повлияет."
  - heading: "Когда страшно, что не сбудется"
    paragraphs:
      - "А что можно сделать с самим страхом? Посмотреть на него: вдруг опять не сбудется, и что тогда произойдёт? Чего я на самом деле боюсь? Да, я расстроюсь. Это правда больно. Но разрушит ли это мою жизнь? Скорее нет."
      - "Можно пойти и дальше и из интереса поисследовать: «И что тогда?» И на каждую мысль, которая приходит, снова спрашивать себя: «И что тогда?» Страх часто кажется большой и сильной фигурой. А когда его так разглядываешь, может оказаться, что вблизи он меньше, чем издалека. И остановиться можно в любой момент, в том числе если от этих вопросов становится тяжелее."
      - "И можно нырнуть поглубже: а что на самом деле стоит за моим желанием? Например: «Я хочу ребёнка. У нас в паре хорошие отношения, и нам важно видеть своё продолжение в детях. Я выросла с ощущением, что семья и дети очень важны. И сейчас хорошее время, чтобы они появились»."
      - "А рядом с этим могут быть страхи и сомнения: «Если это не произойдёт, что тогда? Я не оправдаю ожиданий». Чьих именно? И что из этого — моё? О том, как отличить свои голоса от чужих, я рассказывала в видео о двух ролях: «я как женщина» и «я как мать»."
