cta: "Итоги года — это не один пункт в списке. И у мыши тоже есть свой ресурс. Если сейчас кажется, что год свёлся к одному «не получилось», и хочется разобраться в этом вместе, приходите. Первая встреча — интервью-знакомство. Вы рассказываете о себе столько, сколько готовы, и мы решаем, подходим ли друг другу. Обязательств продолжать нет."
