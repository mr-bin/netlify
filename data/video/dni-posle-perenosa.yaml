sections:
  - heading: "Почему после переноса так тревожно"
    paragraphs:
      - "Женщина постоянно думает: «Получилось? А вдруг что-то идёт не так?» Или наоборот: «Может, надо что-то сделать?» Отсюда и поиск информации: у знакомых, в соцсетях, на форумах."
      - "Иногда, когда ответы находятся, тревога снижается. А иногда, наоборот, разгоняется: информация нередко противоречивая."
      - "Тревога возникает там, где есть неизвестность, неопределённость. И хочется эту неопределённость поскорее закрыть."
      - "Есть и ещё одно. К переносу женщина шла долго, и само решение об ЭКО, скорее всего, далось непросто. Поэтому тревога здесь имеет право быть."
  - heading: "Ранний тест и день теста"
    paragraphs:
      - "Тест уже в шкафчике, до срока несколько дней, а сделать его хочется прямо сейчас. За этим желанием стоит тревога. Здесь важно увидеть свою потребность: «Мне хочется определённости как можно раньше»."
      - "Ранний тест, если и снизит тревогу, то только на короткое время. А может и разогнать её, если покажет отрицательный результат. Поэтому, если хочется что-то сделать прямо сейчас, возможно, имеет смысл выбрать другое занятие. А тест всё-таки сделать в тот день, который назначил врач."
      - "В день теста женщина нередко просыпается раньше будильника, как перед экзаменом. Это ощущение усиливает тревогу. Да, этот день важный. И вместе с тем это не экзамен: результат теста не оценивает ни её способности, ни её личность."
      - "Если хочется, чтобы в этот день рядом был близкий человек, можно попросить его об этом. А если хочется провести его наедине с собой, это тоже возможно. Важно исходить из своих потребностей."
  - heading: "Врач — главный источник информации"
    paragraphs:
      - "Главный источник информации в эти дни — врач. Поэтому важно заранее задать ему все вопросы, которые приходят в голову. Нет глупых вопросов: есть незаданные."
      - "Женщина уже одевается, чтобы ехать домой. Что спросить у врача в первую очередь?"
      - "— При каких признаках срочно связаться с врачом, ехать в клинику или вызывать скорую."
      - "— Как связаться с клиникой вечером и в выходные."
      - "Чтобы, если что-то случится, не ждать и не искать ответы, а сразу действовать. И, конечно, важно соблюдать все рекомендации врача."
      - "А если не читать форумы совсем не получается, можно разрешить себе это: по таймеру, в определённое время. И перед тем как читать, спросить себя:"
      - "— Что сейчас со мной происходит?"
      - "— Какой информации мне не хватает?"
      - "— Нужна ли она мне на самом деле?"
      - "— Что я сейчас чувствую и что на самом деле хочу получить?"
      - "Эти вопросы не для того, чтобы отказаться от чтения, а чтобы вернуть себе осознанность и контакт со своими чувствами и потребностями."
  - heading: "Как прислушиваться к телу, не ища признаков"
    paragraphs:
      - "Прислушиваться к телу, чтобы понять, наступила беременность или нет, скорее усиливает тревогу, но не даёт определённости. Сигналы тела мало скажут о результатах переноса."
      - "И вместе с тем игнорировать тело тоже не стоит. Здесь очень тонкая грань: замечать, что происходит с телом, но для того, чтобы позаботиться о себе. «Мне сейчас холодно или жарко? Может, хочется прилечь или погулять на свежем воздухе? Может, какие-то участки напряжены?» Тогда можно мысленно направить туда расслабление и представить, как оно распространяется дальше."
      - "То есть перестать рассматривать себя под микроскопом в поисках признаков и сменить фокус: с результата на заботу о себе."
      - "А ещё можно признавать свои чувства: «Мне правда сейчас очень тревожно. И я очень хочу, чтобы получилось»."
  - heading: "Когда тревоги больше, чем повода"
    paragraphs:
      - "Бывает, что тревоги больше, чем повода для неё. Возможно, это личная особенность: такой характер, склонный к тревоге. Тогда это проявляется не только в ЭКО или в беременности, но и в других сферах. И обычно женщина это про себя знает."
      - "А раз так, то, скорее всего, она уже как-то справлялась с этим в прошлом. Что она тогда делала? Что ей помогало? Это можно попробовать и сейчас."
  - heading: "Дни ожидания не обязательно проживать в одиночку"
    paragraphs:
      - "Если вы сейчас проживаете дни ожидания, помните: тревожиться естественно. А если тревога очень сильная и мешает жить, это повод обратиться к врачу."
