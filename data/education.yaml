#            в папке assets/documents/ (без подпапок). Пример: "diplom.jpg".
#   caption (обязательно) — подпись под документом, она же текст при наведении
#            и для экранов для слабовидящих (alt).
#   show    (обязательно) — true или false.
#
# Про сами картинки — формат, размер, безопасность — см. раздел ниже
# "КАРТИНКИ ДОКУМЕНТОВ" и файл КАК_РЕДАКТИРОВАТЬ.md.
#
# ПРИМЕР ЗАПИСИ:
#   - file: "novyy-diplom.jpg"
#     caption: "Название документа, 2027"
#     show: false
#
