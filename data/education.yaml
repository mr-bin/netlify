# ============================================================================
# ОБРАЗОВАНИЕ — данные для раздела «Образование» на сайте
# ============================================================================
#
# Этот файл редактируется вручную, без помощи программиста. После правки
# файла нужно опубликовать изменения (как именно — см. КАК_РЕДАКТИРОВАТЬ.md
# в корне проекта).
#
# В файле три раздела:
#   1) timeline    — таймлайн обучения (годы, программы, часы)
#   2) memberships — список членств и аккредитаций
#   3) documents   — галерея дипломов/сертификатов с картинками
#
# ОБЩИЕ ПРАВИЛА:
#   - Для memberships и documents порядок записей на сайте = порядок записей
#     в этом файле. Для timeline это не так — см. отдельное примечание в
#     разделе ТАЙМЛАЙН ОБУЧЕНИЯ ниже: он сортируется автоматически по году.
#   - У каждой записи есть поле "show" (показывать): true — запись видна на
#     сайте, false — запись скрыта. Так можно заранее подготовить запись
#     (например, удостоверение, которое ещё не получено) и включить её потом
#     одной правкой — поменять false на true.
#   - Текст можно писать обычными кавычками-ёлочками («...») и обычными
#     пробелами — вручную ставить неразрывный пробел (&nbsp;) не нужно,
#     сайт сам аккуратно расставит переносы:
#       • после коротких предлогов и союзов (в, с, к, о, на, по и т.д.);
#       • между числом и "ч" (например "144 ч");
#       • после инициалов перед фамилией (например "И.В. Агеева").
#   - Если какое-то необязательное поле оставить пустым (""), оно просто не
#     появится на странице — сайт из-за этого не сломается.
#   - Открывайте файл в обычном текстовом редакторе (TextEdit, Notepad,
#     VS Code — подойдёт любой, который сохраняет "как есть", без форматирования
#     как в Word). На GitHub файл можно редактировать прямо в браузере.
#
# ВАЖНО ПРО ОТСТУПЫ: это YAML-файл, в нём важны пробелы в начале строки.
# Проще всего — копировать существующий блок записи целиком и менять в копии
# только текст после двоеточий, не трогая отступы.


# ----------------------------------------------------------------------------
# 1) ТАЙМЛАЙН ОБУЧЕНИЯ
# ----------------------------------------------------------------------------
# Записи сортируются на сайте автоматически по году (от раннего к позднему) —
# добавлять новую запись можно в любое место списка, куда удобно (например,
# просто в конец), сортировать руками не нужно. Если год указан периодом
# ("2021–2023"), для сортировки берётся первый год из периода.
#
# Поля одной записи:
#   year   (обязательно) — год или период, обязательно с 4 цифрами года (по
#           ним сайт сортирует запись). Пишется в кавычках, например "2022"
#           или "2021–2023" (тире между годами можно скопировать отсюда: –).
#   title  (обязательно) — название программы/квалификации.
#   hours  (необязательно) — объём в часах, например "144 ч". Если неприменимо
#           (например, высшее образование) — оставить "".
#   author (необязательно) — автор методики или учебное заведение/организация,
#           например "И.В. Агеева" или "Московский институт психоанализа".
#           Если не нужно — оставить "".
#   show   (обязательно) — true или false (без кавычек).
#
# ПРИМЕР ЗАПИСИ (скопируйте блок целиком себе в конец списка и замените текст):
#   - year: "2027"
#     title: "Название программы повышения квалификации"
#     hours: "72 ч"
#     author: ""
#     show: false
#
timeline:
  - year: "2019"
    title: "Повышение квалификации «Логотерапия и экзистенциальный анализ»"
    hours: "240 ч"
    author: ""
    show: true

  - year: "2020"
    title: "Профессиональная переподготовка «Логотерапия и экзистенциальный анализ»"
    hours: "384 ч"
    author: ""
    show: true

  - year: "2021"
    title: "Высшее психологическое образование, бакалавриат"
    hours: ""
    author: "Московский институт психоанализа"
    show: true

  - year: "2021–2023"
    title: "Повышение квалификации «Транзактный анализ — Восточная версия»"
    hours: "144 ч"
    author: ""
    show: true

  - year: "2022"
    title: "«Терапия идентичности», работа с психотравмой"
    hours: "48 ч"
    author: ""
    show: true

  - year: "2022"
    title: "Повышение квалификации «Работа психолога с депрессивными состояниями»"
    hours: "72 ч"
    author: ""
    show: true

  - year: "2023–2024"
    title: "Повышение квалификации «Эриксоновская терапия и эриксоновский гипноз»"
    hours: "164 ч"
    author: ""
    show: true

  - year: "2026"
    title: "Повышение квалификации «Репродуктивная психосоматика»"
    hours: "144 ч"
    author: "И.В. Агеева"
    show: true


# ----------------------------------------------------------------------------
# 2) ЧЛЕНСТВА И АККРЕДИТАЦИИ
# ----------------------------------------------------------------------------
# Поля одной записи:
#   text (обязательно) — текст одной строкой.
#   show (обязательно) — true или false.
#
# ПРИМЕР ЗАПИСИ:
#   - text: "Название членства или аккредитации"
#     show: false
#
memberships:
  - text: "Действительный член Общероссийской Профессиональной Психотерапевтической Лиги"
    show: true

  - text: "Аккредитованный полимодальный психотерапевт (СРО «Союз психологов и психотерапевтов»)"
    show: true

  - text: "Аккредитованный психотерапевт «Транзактный анализ — Восточная версия» (СРО «Союз психологов и психотерапевтов»)"
    show: true


# ----------------------------------------------------------------------------
# 3) ДИПЛОМЫ И СЕРТИФИКАТЫ
