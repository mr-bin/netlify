# ----------------------------------------------------------------------------
# КАРТИНКИ ДОКУМЕНТОВ — требования и напоминания
# ----------------------------------------------------------------------------
#   - Папка: assets/documents/ (в корне проекта, не внутри public/).
#   - Формат: JPG.
#   - Размер: ширина примерно 1200–2000 px по длинной стороне — этого более
#     чем достаточно для чёткого увеличения на экране. Вес файла — желательно
#     не больше 2–3 МБ (при сборке сайт сам сожмёт картинку и сам сделает
#     маленькую копию для плитки на странице — готовить вторую "уменьшенную"
#     картинку вручную не нужно).
#   - ПЕРЕД ЗАГРУЗКОЙ: убедитесь, что на фото документа скрыты/размыты
#     регистрационные и серийные номера.
