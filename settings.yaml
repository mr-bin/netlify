# из stats выше. Чтобы добавить плашку — новая строка с "- ", убрать — удалить строку.
hero_stats:
  - "Веду частную практику **с {practice_since}**"
  - "Провела более **{sessions}** клиентских сессий"
  - "Работала с более чем **{clients}** клиентами"
  - "Обучение по репродуктивной психосоматике, **2026**"
